id: visual-misperception
categoryId: perception
name: Visual Misperception
def: |-
  Misreads an image, screenshot, or other visual input: reports objects, text, or interface elements that are not there, misidentifies or miscounts ones that are, binds a label or value to the wrong region, or overlooks something plainly visible.

  Unlike Context-Conflicting Hallucination, the claim conflicts with pixels, not with text in context, so no string comparison against the input can catch it. Unlike Tool Result Misread, the image may come straight from the user, and when a tool does return a screenshot the error is in reading its pixels, not in handling structured output. Unlike GUI Grounding Error, the screen is misread, not mis-acted upon. Unlike Document Parsing Error, the model is reading the image itself; no conversion step has flattened it to text first.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - saw something that isn't in the image
  - misread the screenshot
  - miscounted what's in the picture
  - missed what was right there in the photo

why:
  - >-
    Language priors override what is in the image. When a familiar subject is altered, models report the familiar version. Across seven domains of counterfactual images (such as an extra stripe added to a well-known logo), vision-language models averaged 17.05% counting accuracy, removing the background, and with it the cues that trigger the prior, nearly doubled accuracy, and telling the model to double-check or rely only on the image gained about two points (Vo et al., 2025, "Vision Language Models are Biased").
  - >-
    Fine detail is lost before any reasoning happens. Images are resized and cut into patches for the encoder, so small text, thin lines, and closely spaced shapes are the first casualties. Four vision-language models averaged 58.07% on seven tasks trivial for people, such as counting line intersections or naming a circled letter, and reached near-perfect accuracy once the shapes were spaced further apart (Rahmanzadehgervi et al., 2024, "Vision language models are blind: Failing to translate detailed visual features into words").
  - >-
    The model can look at the right place and still answer wrong. Probing of several model families found that deeper layers attend to the correct evidence region even on questions the model gets wrong, so the failure is partly in using what was seen, not only in seeing it (Liu et al., 2025, "Seeing but Not Believing: Probing the Disconnect Between Visual Attention and Answer Correctness in VLMs"). Nothing in training rewards saying "I can't make that out," so an unreadable region gets a confident reading anyway.
  - >-
    In agents, a misreading becomes the premise for every later step. In 204 human-annotated failed computer-use trajectories, perception was the root cause in 36: elements that were not there, misread text, information bound to the wrong region, visible information missed. The agent then executed a correct plan from a false picture of the screen, and the visible failure surfaced steps later (Zhang et al., 2026, "CUADebug: Diagnosing and Repairing Computer-Use Agent Failures"). The trajectories come from one benchmark, not from deployed traffic.

examples:
  - kind: fail
    label: Typical sign read instead of this one
    text: The sign departs from the common pattern, and the answer follows the common pattern.
    quote: |-
      User: Can I park here on Saturday? [attaches photo]
      [… image: a street sign reading "NO PARKING 7AM–7PM MON–SAT" …]
      Assistant: Yes. The sign restricts parking Monday to Friday, so Saturday is fine.
  - kind: fail
    label: Misread screen state drives the next step
    text: A computer-use agent reads a checked box as unchecked, concludes the setting is already correct, and saves.
    quote: |-
      User: Make sure the invite doesn't go to the whole department, then save it.
      [… screenshot: the "Send to all department members" checkbox is checked …]
      Assistant: The department-wide option is already unchecked, so I'll save the invite as is.
      Tool: click("Save") → saved
  - kind: warn
    label: Confident reading of an unreadable region
    text: The total is obscured in the photo. The model gives a plausible figure instead of saying it cannot read one.
    quote: |-
      User: What's the total on this receipt? [attaches photo]
      [… image: a receipt folded across the bottom; the total line is creased and unreadable …]
      Assistant: The total is $48.70.
  - kind: ok
    label: Evidence read out before the answer
    text: The model transcribes what the sign actually says, then answers from that transcription.
    quote: |-
      User: Can I park here on Saturday? [attaches photo]
      [… image: a street sign reading "NO PARKING 7AM–7PM MON–SAT" …]
      Assistant: The sign reads "No parking 7 AM–7 PM, Mon–Sat," so Saturday daytime is restricted. You can park after 7 PM or on Sunday.

detection:
  - icon: 🧪
    heading: Golden-set evals
    body: >-
      Build an image set with human labels that targets known weak spots: familiar subjects with one detail altered, small or low-contrast text, dense charts and tables, screenshots from your own product at the resolution the system actually receives, and images where the correct answer is "that part can't be read." Score these against the labels. Accuracy on ordinary photos says little about the cases where the prior and the pixels disagree.
  - icon: 🔍
    heading: Observation replay auditing
    body: >-
      In computer-use traces, compare each claim the agent makes about the screen, such as "the option is unchecked" or "the total reads $480," against the accessibility tree, DOM, or OCR captured at the same step. Trace a failed run back to the earliest step whose observation was wrong. Misperception usually surfaces several actions later, and a fix aimed at the step that broke visibly misses the cause.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: >-
      Give the judge the image and the response, and have it locate the region that supports each visual claim, flagging claims with no supporting region and readings of areas that are illegible. Use a judge from a different model family and spot-check it against human labels, since a judge with a similar encoder shares the same blind spots.

mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Require the model to transcribe the visual evidence before answering: quote the text it reads, give the count, name the region, and say when a region cannot be read. A committed transcription makes a prior-driven answer visible and checkable. Generic "look carefully" or "double-check" instructions barely move accuracy when a strong prior is at work, so the instruction has to demand a specific transcription.
  - icon: 🔎
    heading: Tool-backed lookup
    body: >-
      When a text channel exists for what is on screen (accessibility tree, DOM, form state, an OCR pass, file metadata), read load-bearing values from it and use the image for layout and context. Check the two channels against each other before acting. A checkbox state is a field in the DOM, so there is no reason to infer it from pixels.
  - icon: 🔬
    heading: Region re-inspection
    body: >-
      Crop and enlarge the region a claim depends on (a sign's small print, a chart's axis, a toolbar) and re-query on the crop, especially when the source image is large or downscaled. Resizing removes exactly the detail models miss. Re-inspection does not help against prior override, where the detail is visible and the model reports the familiar version anyway.

