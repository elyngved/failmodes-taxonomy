id: verbosity-failure
categoryId: response-integrity
name: Verbosity Failure
def: |-
  Provides more detail, repetition, caveats, background, or explanation than the task, user, medium, or decision requires.

  Unlike Irrelevance, the extra material may be relevant but excessive. Unlike Audience Mismatch, the problem is length and density rather than reader fit overall.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - way too long
  - too verbose
  - rambled on
  - more detail than needed
why:
  - >-
    Reward models prefer longer responses. Length correlates strongly with reward scores in RLHF pipelines, and reward gains come largely from longer outputs rather than other features (Singhal et al., 2023, "A Long Way to Go: Investigating Length Correlations in RLHF"), so optimization can inflate output length even when no new information is added. Human votes carry the same pull: in pairwise arena ratings, length was the dominant style factor, well ahead of headers, bold, and lists (Li et al., 2024, "Does style matter? Disentangling style and substance in Chatbot Arena").
  - >-
    Automated judges share the bias. LLM judges favor longer outputs strongly enough that a leading automatic benchmark had to regress length out of its scores, which raised its agreement with human rankings (Dubois et al., 2024, "Length-Controlled AlpacaEval: A Simple Way to Debias Automatic Evaluators"), so model comparisons and fine-tuning loops built on unadjusted judges reinforce verbosity.
  - Padding hedges against unknown needs. The model cannot see which detail matters to this user, and including everything is never scored as wrong, while omitting the one needed point is, so the asymmetry favors exhaustive answers.
  - Chat formatting conventions add fixed overhead. Tuned-in habits such as restating the question, announcing the structure, listing caveats, and closing with a summary attach to responses regardless of whether the content warrants them. Agents carry the same habits into their final reports, narrating the plan, recapping each step, and listing next steps nobody asked for around a result the user could have read from the diff.
examples:
  - kind: fail
    label: Padding around a one-word answer
    text: Wraps a single fact in restatement, background, caveats, and a closing summary, none of which was asked for.
    quote: |-
      User: What's the capital of Australia?
      Assistant: Great question! The capital of Australia is a common point of confusion, as many people assume it's Sydney or Melbourne, both larger and better-known cities. In fact, the capital is Canberra, a planned city purpose-built in 1913 as a compromise between the two rivals. So, to summarize: the capital of Australia is Canberra.
  - kind: warn
    label: Fixed chat overhead
    text: Gives a right-sized answer, then lets tuned-in framing habits add boilerplate at both ends.
    quote: |-
      User: What's the capital of Australia?
      Assistant: I'd be happy to help with that! The capital of Australia is Canberra. Let me know if you'd like to learn more about Australian geography!
  - kind: ok
    label: Sized to the question
    text: Delivers the fact at the length the question warrants.
    quote: |-
      User: What's the capital of Australia?
      Assistant: Canberra.
  - kind: fail
    label: Agent report longer than the change
    text: Fixes a one-line bug, then buries the result in a recap of the coding agent's own process.
    quote: |-
      User: The date filter on the orders page is off by one. Fix it.
      Tool: edit orders/filter.py (1 line changed); run tests → 214 passed
      Assistant: ## Summary of Changes
      I began by exploring the codebase to understand how filtering works… [… 400 words: investigation narrative, a "Key Insights" section, a table of files read, five suggested follow-ups …] The fix changes `<` to `<=` on line 88.
detection:
  - icon: 📏
    heading: Compression testing
    body: Have a model compress the response to its minimal sufficient form and measure what fraction survives. An answer that reduces from 150 words to one with nothing lost was padding by construction, so compressibility is a direct, mechanical measure of the overhead.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: >-
      Counter length bias explicitly in the rubric, because LLM judges share the bias that causes verbosity: score information per token, compare the response pairwise against its compressed version and ask what the extra words bought, or regress length out of pairwise win rates. A judge asked simply to rate quality will reward the verbosity it was meant to catch.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain questions with known minimal sufficient answers and measure token overhead above that floor, tracking boilerplate markers (restated questions, announced structure, closing summaries) separately from content. Fixed chat overhead appears as a constant token cost on every answer regardless of the question's size.
mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Size the answer to the question and the medium, and ban the fixed overhead by name: no restating the question, no announcing the structure, no closing summary, no "great question". For agents, require a report of the result and anything the user must check, not the process; for voice, allow one to three spoken sentences per turn. Where the API offers a verbosity or effort setting, set it per route rather than in prose. Prefer targets scaled to the task over hard word caps, which cut load-bearing detail along with the padding.
  - icon: 🧹
    heading: Output post-processing
    body: >-
      Run the compression test as a fix instead of a metric: reduce the draft to its minimal sufficient form and ship that version. Padding, such as 150 words wrapped around the one-word answer "Canberra", survives because generation has no revision pass. A compression pass supplies that revision, and whatever it cannot remove without losing information is the actual answer.
  - icon: 🧑‍🏫
    heading: Preference data curation
    body: Break the length-reward correlation at its source by penalizing length in the reward model, scoring information per token rather than coverage, and checking judge models for the same bias before trusting their ratings. Optimization against length-biased signals produces verbosity, and any loop that keeps the bias keeps producing it.

related:
