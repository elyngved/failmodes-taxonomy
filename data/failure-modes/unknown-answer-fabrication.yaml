id: unknown-answer-fabrication
categoryId: fabrication
name: Unknown-Answer Fabrication
def: |-
  Gives a confident answer when the system lacks enough evidence, access, or uncertainty resolution to know the answer.

  Unlike content-specific hallucinations such as Entity Hallucination or Numerical Hallucination, this mode describes the decision to answer instead of acknowledging uncertainty; the fabricated content can take many forms. Unlike Action Misreporting, the unsupported content is about the world or the user's situation, not about what the system itself did; an answer that states or implies a check, test, or lookup the trace does not show belongs there, even when the claim it supports is also a guess. Unlike Strategic Deception, the system lacks the information; there, it has it and states otherwise.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - made up an answer instead of saying it didn't know
  - guessed confidently
  - should have said it didn't know
  - fabricated when unsure
why:
  - Most benchmarks grade answers as right or wrong with no credit for "I don't know." Under that scoring, guessing always beats abstaining, and models are optimized accordingly (Kalai et al., 2025, "Why Language Models Hallucinate").
  - >-
    In training data, questions are almost always followed by answers, and preference tuning reinforces the pattern. Preference-annotated datasets show a human bias against text that expresses uncertainty, and models answer without hedging even when they are wrong (Zhou et al., 2024, "Relying on the Unreliable: The Impact of Language Models' Reluctance to Express Uncertainty").
  - >-
    Reinforcement finetuning on verifiable tasks can strip abstention further. Rewarding correct final answers cut refusal on unanswerable problems by more than 80%, and mixing in a small share of unanswerable training problems largely restored it (Song et al., 2025, "The Hallucination Tax of Reinforcement Finetuning").
  - Models often carry internal signals about how likely they are to be right, and standard generation never consults those signals (Kadavath et al., 2022, "Language Models (Mostly) Know What They Know").
  - >-
    Interpretability work locates the decision. Models carry internal features for whether they recognize an entity, and these causally gate refusal versus answering (Ferrando et al., 2025, "Do I Know This Entity? Knowledge Awareness and Hallucinations in Language Models"). One circuit study found a default "can't answer" path that familiarity suppresses; when a name or topic is familiar but the specific fact is not known, the suppression misfires and the model answers anyway (Lindsey et al., 2025, "On the Biology of a Large Language Model").

examples:
  - kind: fail
    label: Confident answer without access
    text: Answers as though the diagnosis were known despite having no visibility into the user's account, inventing both the cause and a policy to support it.
    quote: |-
      User: Why is my API key suddenly returning 403 errors?
      Assistant: Your key has expired — keys are automatically rotated every 90 days, so you'll need to generate a new one in the dashboard.
      [… the system has no access to the user's account, and no such rotation policy exists …]
  - kind: warn
    label: Guess dressed as a leading answer
    text: Offers one plausible cause as "most likely" without acknowledging it cannot inspect anything, so a guess reads as a diagnosis.
    quote: |-
      User: Why is my API key suddenly returning 403 errors?
      Assistant: This is most likely a billing issue — 403s usually mean your plan lapsed. Check your payment method first.
  - kind: fail
    label: Agent answers past its tools
    text: Has repository access but no tool that reads CI logs, and instead of saying so names a specific failure cause that nothing in its context supports.
    quote: |-
      User: Why did last night's CI run fail?
      Tool: [available tools: read_file, edit_file, run_tests — no CI log access]
      Assistant: The run failed because the integration tests timed out waiting on the database container. Bumping the timeout to 120s should fix it.
  - kind: ok
    label: Calibrated non-answer
    text: States what it cannot see, then converts the unknown into a checkable list instead of a fabricated answer.
    quote: |-
      User: Why is my API key suddenly returning 403 errors?
      Assistant: I can't see your account, so I can't say which it is — but 403s on a previously working key usually come down to a revoked or rotated key, an expired plan, or a new IP/permission restriction. The response body's error code will narrow it down; can you paste it?

detection:
  - icon: 🎲
    heading: Self-consistency sampling
    body: Sample the same question several times at nonzero temperature. When the model knows the answer, the samples agree; when it is guessing, they scatter across different confident answers. Divergence is a direct signal that the response is fabrication rather than knowledge.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Run a judge over the answer and the trace that asks whether the system had the evidence or access needed to answer at all (could it see the user's account, the file, the CI log?) and flags confident answers whose content depends on information no tool call or context provided.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain a test set of questions that are unanswerable by construction (missing access, withheld context, or genuinely unsettled questions), and regression-test the abstention rate. Any confident answer on this set is a fabrication by definition. On answerable sets, score wrong answers below abstentions rather than equal to them, because accuracy-only scoring teaches guessing.

mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: Explicitly authorize "I don't know" and "I can't see that" as good answers, and instruct the model to state what it would need (access, context, an error message) before diagnosing. This counters the training-time pattern where every question is followed by an answer.
  - icon: 🎚️
    heading: Confidence-based abstention
    body: Consult the uncertainty signals the model already carries (token probabilities, self-rated confidence, or agreement across samples) and route low-confidence answers to abstention or hedged framing instead of letting standard generation ignore them. Models' own estimates that an answer is correct are well calibrated in familiar formats and improve when the model compares several of its samples, though they calibrate worse on new tasks (Kadavath et al., 2022, "Language Models (Mostly) Know What They Know").
  - icon: 🛠️
    heading: Tool-backed lookup
    body: Give the system the access the question requires (account state, logs, search) so it can check instead of guess. Many unknown-answer fabrications are really missing-tool problems; for example, a model that can read a 403 response body does not need to invent a key-rotation policy to explain it.

