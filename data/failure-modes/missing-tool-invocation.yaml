id: missing-tool-invocation
categoryId: tools
name: Missing Tool Invocation
def: |-
  Fails to call an available tool when tool use is necessary for correctness, freshness, computation, retrieval, verification, or task completion.

  Unlike Insufficient Agency, this is specifically about omitted tool use. Unlike Verification Failure, the missing check is a tool call rather than general review or reasoning. Unlike Unnecessary Tool Invocation, the error is the skipped call, not a superfluous one.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - didn't use the tool
  - should have called a tool
  - answered without searching
  - skipped the tool it needed
examples:
  - kind: fail
    label: Answered from memory with the tool sitting there
    text: Answers from parametric knowledge with a fluent, wrong figure, although a metrics tool is available and the question demands current data.
    quote: |-
      System: You have access to query_metrics for live business data.
      User: What's our MRR right now?
      Assistant: Your MRR is approximately $240k, continuing the steady growth trend from earlier this year.
  - kind: warn
    label: Hedged guess instead of a lookup
    text: Acknowledges that its answer might be stale but still doesn't call the tool that would settle it, so the uncertainty stays unresolved.
    quote: |-
      System: You have access to query_metrics for live business data.
      User: What's our MRR right now?
      Assistant: I believe it was around $240k as of the last figures I saw, though that may be out of date.
  - kind: fail
    label: Deferred tool never searched for
    text: Checks only the tools already in context, finds nothing, and reports a limitation instead of looking, although a calendar tool exists whose definition loads only on search.
    quote: |-
      System: 3 tools loaded. More tools are available through search_tools(query).
      User: What's on my calendar tomorrow morning?
      Assistant: I don't have access to your calendar, so I can't check that. If you paste your schedule here, I can help you plan around it.
  - kind: ok
    label: Need recognized, tool called
    text: Recognizes "right now" as a freshness requirement it can't satisfy from memory and routes the question to the tool.
    quote: |-
      System: You have access to query_metrics for live business data.
      User: What's our MRR right now?
      Tool: query_metrics(metric=mrr) → $263,400
      Assistant: Current MRR is $263,400.
why:
  - >-
    Pretraining teaches the model to answer from parametric memory, so it can answer directly even when a tool would be more reliable. Knowing when to reach for a tool has to be trained on top of that, as Toolformer was, learning which APIs to call, when, and with what arguments (Schick et al., 2023, "Toolformer: Language Models Can Teach Themselves to Use Tools"). Models tuned for tool calling still show significant room for improvement when tested on whether to call, ask a follow-up question, or decline (Ross et al., 2025, "When2Call: When (not) to Call Tools").
  - Models recognize their own knowledge gaps only partly. Across 20 models, the ability to identify unanswerable or unknowable questions was real but fell well short of human performance (Yin et al., 2023, "Do Large Language Models Know What They Don't Know?"). If the model does not recognize that it lacks fresh, precise, or computed information, the internal trigger for reaching for a tool never fires.
  - Preference tuning rewards confident, immediate answers. Raters rarely penalize a fluent response for skipping a tool call they cannot see was needed, so answering inline is cheap during training.
  - Tool availability is communicated through descriptions in the prompt, where it competes with everything else in context. Guidance to avoid unnecessary calls for latency and cost overcorrects into suppressing calls that were actually required.
  - >-
    Deferred tool loading adds a step that can be skipped. When definitions stay out of context until the model searches for them, a capability the model does not think to look for is never called, and it may tell the user it has no such access. In a benchmark of 527 tools across 70 servers, retrieval errors accounted for nearly half of all failures (Mo et al., 2025, "LiveMCPBench: Can Agents Navigate an Ocean of MCP Tools?").
detection:
  - icon: 🔍
    heading: Tool-call coverage auditing
    body: Classify incoming requests by whether they require live, account-specific, or computed data, and flag responses produced with zero tool calls. "What's our MRR right now?" answered without touching query_metrics is detectable from the trace alone, regardless of whether the number happens to be close.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: >-
      Show the judge the available tools alongside the response and ask whether the answer could be known without calling one. Flag hedged guesses as firmly as confident ones: an answer that acknowledges uncertainty but does not resolve it with an available tool is still the failure.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain questions whose correct answers exist only behind a tool (live metrics, current inventory, account-specific state), with ground truth that diverges from anything plausible in pretraining. Score the trace for the required call, not just the answer, so a lucky stale response doesn't pass.
mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Name the categories that must come from tools (live metrics, account-specific state, anything computed or dated) and state that answering them from memory is noncompliant even when the model feels confident. Make hedging a trigger for the call: "that may be out of date" while the tool is available means call the tool, because the model's calibration about its own gaps is not reliable enough to trigger the call unprompted.
  - icon: 🔁
    heading: Validate-and-retry loops
    body: Classify incoming requests by whether they require live or account-specific data, and reject responses to those requests whose trace shows zero tool calls, and send the task back with the requirement named. Without that check, a fluent figure recalled from memory, such as an MRR of $240k, ships, because nothing in generation distinguishes it from a looked-up one. For request classes that always need a lookup, force the call through the API's tool-choice control rather than leaving it to the model to elect.
  - icon: 🗂️
    heading: Tool catalog curation
    body: Keep the catalog small and the descriptions sharp, stating what each tool uniquely knows ("the only source of current MRR"), so the model can connect a freshness need to the capability that meets it. A tool buried in a long catalog of vague descriptions loses the competition for attention, and overcautious cost guidance suppresses calls further. Where tools load on demand, keep a one-line index of the deferred capabilities in context, so the model knows there is something to search for.

related:
