id: prompt-brittleness
categoryId: control
name: Prompt Brittleness
def: |-
  Produces materially different answers when the prompt is reworded, reformatted, or rerun, even though nothing meaningful about the request changed.

  Unlike Self-Contradiction, the inconsistency appears across separate runs or phrasings rather than within one response. Unlike Instruction Noncompliance, each individual response may follow the instructions; what fails is stability across immaterial variation. Unlike Evaluation Awareness, the variation is arbitrary; there, it tracks cues that the input is a test.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - different answer every time
  - rephrasing flipped the answer
  - inconsistent across runs
  - small prompt change broke it
why:
  - >-
    Sampling is stochastic by design. At nonzero temperature the same prompt yields different token paths, and where the model's underlying uncertainty is high, those paths diverge into different confident answers rather than rewordings of one answer. Temperature 0 does not fully fix this on shared serving: kernels that are not batch-invariant make each request's numerics depend on how many others it was batched with, so 1,000 greedy completions of one prompt produced 80 distinct outputs in one test (Thinking Machines Lab, 2025, "Defeating Nondeterminism in LLM Inference").
  - >-
    Models are sensitive to semantically irrelevant features of the prompt. Formatting choices like separators, casing, and option order swing task accuracy by tens of points while leaving the meaning untouched (Sclar et al., 2024, "Quantifying Language Models' Sensitivity to Spurious Features in Prompt Design or: How I learned to start worrying about prompt formatting"). Part of the measured effect belongs to the scorer, not the model: rigid answer matching marks correct paraphrased answers wrong, and rescoring with a semantic judge substantially reduced variance across prompt templates for the models tested, though not on math (Hua et al., 2025, "Flaw or Artifact? Rethinking Prompt Sensitivity in Evaluating LLMs").
  - Pretrained models encode inconsistent beliefs, so paraphrasing the same factual query can elicit different answers from the same weights (Elazar et al., 2021, "Measuring and Improving Consistency in Pretrained Language Models"). Which learned position surfaces depends on local phrasing cues, not on the question's content.
  - Prompts are tuned against one exact phrasing. A template that "works" was validated at a single point in input space, and small edits, whether by a developer, a paraphrasing user, or an upstream template change, move the input across decision boundaries no one can see.

examples:
  - kind: fail
    label: Identical input, opposite verdicts
    text: Reaches contradictory conclusions on two runs of the same classification request at the same settings. The instability, not either answer, is the failure.
    quote: |-
      User: Does this error log indicate a memory leak? [log attached]
      Assistant: Yes — heap usage climbs steadily across restarts, which is the classic leak signature.
      [… identical request, second run …]
      Assistant: No — this looks like normal GC pressure under load, not a leak.
  - kind: warn
    label: Paraphrase flips the answer
    text: Retrieves different learned positions for two phrasings any reader would call equivalent, and nothing flags that the answers disagree.
    quote: |-
      User: Is it safe to run this migration while the app is serving traffic?
      Assistant: Yes, it's an additive schema change — safe to run live.
      [… separate session, same migration …]
      User: Can I run this migration without taking the app down?
      Assistant: I'd schedule downtime — running schema changes against live traffic is risky.
  - kind: ok
    label: Stable across phrasings, uncertainty surfaced
    text: Holds the substance across reruns and rewordings, and where the evidence is genuinely ambiguous, says so consistently instead of resolving the ambiguity differently each time.
    quote: |-
      User: Does this error log indicate a memory leak? [log attached]
      Assistant: Inconclusive from this log alone — heap usage climbs, but the window is too short to separate a leak from warm-up. A longer capture across two GC cycles would settle it.

detection:
  - icon: 🎲
    heading: Self-consistency sampling
    body: Run the same prompt several times at production settings and measure answer agreement. Divergence into different confident answers (a memory leak on one run, normal GC pressure on the next) maps the inputs where the system is unstable, before a user discovers it one run at a time.
  - icon: 🔀
    heading: Paraphrase perturbation testing
    body: Rephrase each eval item in ways that preserve meaning (synonyms, reordered clauses, different formatting) and diff the answers across variants. Substance that moves with the wording is brittleness measured directly, and formatting-only variants isolate the spurious-feature sensitivity.
  - icon: 🧪
    heading: Golden-set evals
    body: Score the eval suite on variance, not just mean accuracy. Run each item multiple times and across paraphrase variants, and track per-item flip rates. A flaky eval is this failure showing up in development, and averaging reruns away as noise hides exactly that signal. Score open-ended answers semantically, not by exact string match, or the variance you measure will partly be your scorer's.

mitigation:
  - icon: 🎚️
    heading: Deterministic decoding
    body: Use temperature 0 or a fixed seed for classification-style and decision-style tasks where run-to-run variance is pure cost. This removes the sampling half of the failure cheaply. It does not remove paraphrase sensitivity, and it does not fully remove sampling variance on serving stacks where batching introduces its own nondeterminism. Where you serve the model yourself and need bit-identical reruns, batch-invariant kernels close that gap at a throughput cost. On a hosted API, cache the decision for repeated identical inputs instead.
  - icon: 🗳️
    heading: Majority-vote ensembling
    body: For unstable, high-stakes calls, sample several responses and take the majority answer, treating the agreement rate as a confidence signal (Wang et al., 2023, "Self-Consistency Improves Chain of Thought Reasoning in Language Models"). A 5-of-5 verdict and a 3-of-5 verdict deserve different downstream handling.
  - icon: 🧱
    heading: Input canonicalization
    body: Render user content into a fixed template (normalized formatting, consistent field order, one canonical phrasing for recurring questions) before it reaches the model, so immaterial variation is removed at the boundary instead of being passed through to weights that are sensitive to it.

