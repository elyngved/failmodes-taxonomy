id: genericism
categoryId: response-integrity
name: Genericism
def: |-
  Gives vague, boilerplate, or template-like guidance that is too nonspecific or abstract for the user to act on, instead of concrete help grounded in their task.

  Unlike Irrelevance, generic content may be on topic but too nonspecific to be useful. Unlike Incompleteness, the topic may be covered while the answer still offers nothing the user can actually execute.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - generic boilerplate answer
  - too vague to act on
  - template-like response
  - nonspecific advice
  - sounds like ai wrote it
why:
  - Next-token prediction averages over the training distribution. For any common question, the highest-likelihood response is the one that fit the most past contexts, which is by construction the least specific to this one.
  - >-
    Alignment tuning collapses output diversity. RLHF concentrates probability on a narrow band of safe, high-scoring response shapes, trading the distribution's tails, where situation-specific answers live, for the reliable middle (Kirk et al., 2024, "Understanding the Effects of RLHF on LLM Generalisation and Diversity"). The collapse now spans models: on open-ended real-world queries, one model repeats itself across samples and different models give strikingly similar answers, while language models, reward models, and judges are all less well calibrated to human ratings where people's preferences differ (Jiang et al., 2025, "Artificial Hivemind: The Open-Ended Homogeneity of Language Models (and Beyond)"), so every user gets much the same answer.
  - Generic advice is unfalsifiable, and the reward signal notices. Boilerplate cannot be wrong, so it never draws the penalty a concrete recommendation risks, and preference tuning steadily favors the answer that no rater can fault.
  - >-
    The template shows in the wording, and readers see it. Tuned models reuse stock phrases and answer shapes, some at over 1,000 times their rate in human text (Paech et al., 2025, "Antislop: A Comprehensive Framework for Identifying and Eliminating Repetitive Patterns in Language Models"), and readers who use these tools often spot model-written text reliably (a majority vote of five such readers misclassified 1 of 300 articles), cueing on that vocabulary and on formality and lack of originality (Russell et al., 2025, "People who frequently use ChatGPT for writing tasks are accurate and robust detectors of AI-generated text"). A reader who recognizes the template has no cue that anything inside it was written for them.
  - The model lacks the context specificity requires, and is tuned not to ask. Concrete guidance depends on constraints the prompt omits, and since clarifying questions rate poorly, the model answers anyway at the only level of specificity the missing information allows.
examples:
  - kind: fail
    label: Boilerplate instead of help
    text: Returns the listicle any churn question gets, using none of the specifics the user provided.
    quote: |-
      User: My B2B SaaS churn jumped from 3% to 8% last quarter, right after we raised prices 40% and sunset the legacy plan. What should I do?
      Assistant: Reducing churn starts with understanding your customers. Improve onboarding, gather feedback regularly, build customer loyalty, and deliver consistent value. Engaged customers are retained customers!
  - kind: warn
    label: On-topic but unexecutable
    text: Engages with the situation but stays so general that nothing said implies a next action.
    quote: |-
      User: My B2B SaaS churn jumped from 3% to 8% last quarter, right after we raised prices 40% and sunset the legacy plan. What should I do?
      Assistant: A price increase of that size can definitely impact retention. You'll want to look at whether the churn is price-related and consider whether your value communication matched the change.
  - kind: warn
    label: Stock frame around the substance
    text: Includes the one useful point but delivers it in the stock phrasing and answer shape readers recognize as template output, so it gets skimmed as such.
    quote: |-
      User: My B2B SaaS churn jumped from 3% to 8% last quarter, right after we raised prices 40% and sunset the legacy plan. What should I do?
      Assistant: Great question — and an important one. Here's the thing: churn isn't just a metric, it's a signal. Let's dive in. **1. Listen.** **2. Segment** — check whether the legacy-plan migrants account for the jump. **3. Act.** Ultimately, it's about building trust, one customer at a time.
  - kind: ok
    label: Grounded in the specifics
    text: Builds the answer from the facts given and ends in steps the user can execute this week.
    quote: |-
      User: My B2B SaaS churn jumped from 3% to 8% last quarter, right after we raised prices 40% and sunset the legacy plan. What should I do?
      Assistant: The timing points at the migration, not churn in general. First, split last quarter's churned accounts into legacy-plan migrants vs. everyone else — if migrants dominate, this is a one-time cohort event, not a trend. For accounts still in their migration window, offer a 12-month grandfathered rate; that usually stanches the bleeding while you confirm the cohort theory.
detection:
  - icon: 📏
    heading: Specificity scoring
    body: Count how many of the prompt's particulars the answer actually uses, such as a 40% price raise, a sunset legacy plan, and a 3-to-8% churn jump. An answer that references none of them could have been written without reading the question, which defines template output and can be measured mechanically. Track stock-phrase rates against a human baseline alongside it, and sample several answers across users for the same prompt; near-identical answers show the template.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: >-
      Ask the judge two questions: could this response have been generated from the topic alone, and what concrete action does it imply for this user this week? A response can engage with the situation but stay so general that nothing said implies a next step, and only the second question catches it.
  - icon: 🧪
    heading: Golden-set evals
    body: Build detail-rich scenarios where the right answer depends on the supplied facts (such as a churn spike whose timing points at a migration cohort, not churn in general), and score whether the recommendations change when the details do. Generic output scores identically across scenario variants; grounded output cannot.
mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: Require the answer to use the particulars the user supplied and to end in steps executable this week, and, when the specifics needed for concrete guidance are missing, to ask for them instead of answering at the level of generality the gap allows. The generic listicle is the trained default, and both halves of the constraint exist to rule it out.
  - icon: ✅
    heading: Self-check pass
    body: Before delivering, have the model check which of the prompt's facts the draft actually uses, such as a 40% price raise, a sunset plan, and a 3-to-8% churn jump. A draft that uses none could have been written without reading the question, and that test failing is the signal to regenerate from the specifics rather than polish the template.
  - icon: 🧑‍🏫
    heading: Preference data curation
    body: Rate concrete, falsifiable recommendations above polished boilerplate, deliberately rewarding answers that take a position a rater could fault. Tuning reinforces Genericism because unfalsifiable advice never draws a penalty, and until the data penalizes such advice, tuning keeps collapsing toward the safe middle.
  - icon: 🧹
    heading: Output post-processing
    body: >-
      Suppress the stock layer mechanically: profile the model's over-represented phrases against human text, then block them at decode time with a backtracking sampler or strip them in a rewrite pass. Plain token bans break down as the list grows, and removing phrases does not add substance, so pair the filter with a specificity check that counts which of the prompt's particulars the answer uses. The text that passes both is the part written for this user.

