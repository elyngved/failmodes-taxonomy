id: clarification-overuse
categoryId: control
name: Clarification Overuse
def: |-
  Asks the user for clarification when the task is already sufficiently specified, stalling on details the system could reasonably infer or safely proceed without.

  Unlike Clarification Underuse, the error is asking when it should act, not acting when it should ask. Unlike Insufficient Agency, the system does respond, by asking, rather than failing silently to make an obvious next move. Unlike Approval Fatigue, the cost is the user's time, not a control that stops working.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - asked too many questions
  - kept asking instead of doing
  - asked when it was obvious
  - stalled asking for details
examples:
  - kind: fail
    label: Stalling on the obvious
    text: Burns a round trip asking about details with obvious answers, though the task is fully specified and mechanically checkable.
    quote: |-
      User: Rename the function getUser to fetchUser everywhere in the repo.
      Assistant: Before I start — should I also update the call sites? And do you want the test files included, or just source files?
  - kind: warn
    label: Acting but hedging with questions
    text: Gets the work done, but trails off into unnecessary questions that invite another turn the user doesn't need.
    quote: |-
      User: Rename the function getUser to fetchUser everywhere in the repo.
      Assistant: Done — renamed in all 14 files. Would you like me to verify the tests still pass? Should I also check for any documentation mentions? Let me know how you'd like to proceed.
  - kind: fail
    label: Unattended run stalls on a question
    text: Stops two minutes into an unattended run to ask a question the repository already answers. The user started the agent and left, so the run sits idle for hours.
    quote: |-
      User: Migrate the test suite from the old runner to the new one. I'll check back this evening.
      [… two minutes in …]
      Assistant: Quick question before I continue: should the migrated tests keep using the existing fixtures directory, or would you prefer a new one?
      [… no reply for six hours; the existing config already points at the fixtures directory …]
  - kind: ok
    label: Proceeding on reasonable defaults
    text: Commits to the obvious interpretation, completes the task, and surfaces its choices for review instead of asking first.
    quote: |-
      User: Rename the function getUser to fetchUser everywhere in the repo.
      Assistant: Renamed across 14 files, including call sites, tests, and the two doc references. Tests pass.
why:
  - Preference tuning penalizes a confidently wrong action more than an unnecessary question, and asking reads as conscientious to human evaluators. Under uncertainty, asking is the low-risk move for the model even when the expected cost to the user is higher.
  - Safety and carefulness training generalize broadly. "Check before acting" is reinforced for genuinely risky operations, and the learned caution spills over into benign, fully specified tasks.
  - Models do not reliably track which missing details are recoverable from context, convention, or a cheap reversible attempt. Without that judgment, every unknown looks like grounds for a question.
  - >-
    Models do not price the user's interruption. In long-horizon agent tasks with a simulated user, redundant questions made up 8–38% of trials with questions depending on the model, and every model also under-asked in other trials, so the problem is calibration rather than a fixed habit. For one model on one task set, telling the agent the user's time was expensive cut questions by about a third at the same gain per question (Pu et al., 2026, "LHAW: Controllable Underspecification for Long-Horizon Tasks").
detection:
  - icon: 📊
    heading: Clarification rate monitoring
    body: Track question-turns on tasks that are fully specified, plus round trips burned before any work starts and the density of trailing questions after completed work. A rising ask-rate on mechanically checkable tasks is this mode's production signature.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: For each clarifying question asked, have a judge assess whether the answer was recoverable from context, convention, or a cheap reversible attempt. Questions with obvious answers are the failure even when they sound conscientious.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain fully specified tasks with verifiable outcomes and score whether the model completes them without a round trip. Also score completed work that trails off into unnecessary questions inviting another turn.
mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: Instruct the model to proceed on reasonable defaults and report the choices it made for review, rather than asking first. Explicitly ban the trailing-question habit, where finished work dissolves into "would you like me to…?" Asking is the model's low-risk move, so the prompt has to assign the cost of the round trip that preference tuning never charged it for. Stating the cost of the user's time explicitly has been measured to reduce question volume. Check that the questions this removes are the redundant ones, because total gain from asking can fall too.
  - icon: ✅
    heading: Self-check pass
    body: Before asking, require the model to check whether the answer is recoverable from context, from convention, or from a cheap reversible attempt. A question that survives that filter is worth the user's turn. "Should I update the call sites?" on a request to rename a function everywhere does not survive it, because the request answers it by definition.
  - icon: ♻️
    heading: Reversible-by-default execution
    body: >-
      For cheap, undoable work, make attempting the default: commit to the obvious interpretation, make the change, and surface what was chosen. A wrong guess costs one revert, while the question costs a round trip even when the guess would have been right. Reversibility is what makes proceeding the rational policy.

