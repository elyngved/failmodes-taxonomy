id: format-failure
categoryId: control
name: Format Failure
def: |-
  Produces an answer in the wrong shape, organization, medium, style, or presentation format for the requested output.

  Unlike JSON/Schema Failure, the output may be valid text but in the wrong form. Unlike Poor Structure, the issue is failing a requested or expected format, not merely being hard to scan.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - wrong output format
  - didn't follow the format
  - wrong shape of answer
  - ignored the requested format
examples:
  - kind: fail
    label: Requested shape ignored
    text: Gets the content right but delivers it as prose with headings when the user asked for a table to paste into a doc, which defeats the purpose.
    quote: |-
      User: Give me our four services with owner and on-call rotation as a markdown table — I'm pasting it into the runbook.
      Assistant: Here's an overview of your services. **Auth service.** Owned by the identity team, with a weekly on-call rotation…
  - kind: warn
    label: Right format, wrong envelope
    text: Includes the table but wraps it in preamble and follow-up prose that the user will have to strip out before pasting.
    quote: |-
      User: Give me our four services with owner and on-call rotation as a markdown table — I'm pasting it into the runbook.
      Assistant: Great idea to document this! Here's a table that should work nicely for your runbook: [table] Let me know if you'd like me to add more columns!
  - kind: fail
    label: Chat formatting in a voice channel
    text: Runs behind text-to-speech but answers with the markdown habits of chat, so the speech engine reads the markup aloud or flattens a list into one run-on sentence.
    quote: |-
      System: You are a voice assistant. Replies are spoken aloud.
      User: What do I need to bring to the passport appointment?
      Assistant: **You'll need:** 1. The completed form 2. Two photos 3. Proof of citizenship
      [… spoken as "asterisk asterisk you'll need asterisk asterisk one the completed form two two photos three…" …]
  - kind: ok
    label: Format followed exactly
    text: Returns the requested artifact and nothing else, ready to paste.
    quote: |-
      User: Give me our four services with owner and on-call rotation as a markdown table — I'm pasting it into the runbook.
      Assistant: | Service | Owner | On-call |
      | Auth | Identity team | Weekly |
      | Billing | Payments team | Biweekly | …
why:
  - Format instructions compete with strong priors about how content of this kind is usually presented in training data. A request for prose meets a learned habit of bullet lists, and the habit often wins.
  - Models fail even simple, mechanically checkable format instructions at substantial rates, which shows the gap is in following the spec, not in understanding it (Zhou et al., 2023, "Instruction-Following Evaluation for Large Language Models").
  - The format spec sits at the top of the prompt while generation is governed by local continuation pressure. Far into a response, the nearby text shapes the next token more than the distant instruction does.
  - Users specify formats loosely, with terms like "brief" or "a table" that admit many readings. The model fills the unspecified dimensions from its prior, which may not match what the requester pictured. The rendering surface is often unstated too. Voice, SMS, a terminal, or another program's input each need a different shape, and the chat-tuned default is markdown.
detection:
  - icon: 📐
    heading: Mechanical format checks
    body: >-
      Verify the requested shape with deterministic checks: whether a table is present, whether the word count fits, and whether the response is free of preamble and trailing commentary. Most format specs decompose into assertions a script can run on every output.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Run a judge on loosely specified formats ("brief," "something I can paste into the runbook") that asks whether the response is the requested artifact and nothing else. Score wrapper prose around a correct artifact separately, as a lower-severity case.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain a suite of verifiable format instructions across content types and rerun it on every model or prompt change. Include long outputs, where local continuation pressure overrides a format spec stated at the top.
mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Make the spec concrete and hard to miss: give a literal exemplar of the desired shape, an explicit "the response is the artifact and nothing else," and for long outputs a restatement near the end of the prompt rather than only the top. A vague "as a table" leaves every other dimension to the model's prior, which is exactly where the learned habit wins. Name the rendering surface in the system prompt ("spoken aloud, no markup", "plain-text SMS") so the model doesn't default to chat formatting.
  - icon: 🔁
    heading: Validate-and-retry loops
    body: Run mechanical format checks (table present, word count within bounds, no preamble or trailing commentary) and regenerate on failure with the specific miss named. Format compliance is probabilistic per attempt, and most requested shapes decompose into assertions cheap enough to gate every output on.
  - icon: ✂️
    heading: Output post-processing
    body: Extract the artifact deterministically, rather than regenerating, when it is correct but wrapped in preamble, pleasantries, and follow-up prose. Chat tuning makes this conversational envelope the most common failure here, and a few lines of stripping code fix it for free.

related:
  - id: json-schema-failure
  - id: poor-structure
  - id: constraint-violation
