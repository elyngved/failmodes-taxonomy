id: retrieval-distractor
categoryId: retrieval
name: Retrieval Distractor
def: |-
  Retrieves or elevates irrelevant, superficially similar, unreliable, or otherwise misleading evidence that pulls the answer away from the user's actual need.

  Unlike RAG Poisoning, the distractor need not be malicious or corrupted — an on-topic satire piece, joke thread, machine-generated reference page, or self-interested vendor page is a distractor when nobody planted it to be retrieved. Unlike Query Rewrite Failure, the retrieval may match the issued query while the selected evidence is still the wrong evidence to trust.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - retrieved a misleading doc
  - distracted by similar content
  - pulled the wrong evidence
  - irrelevant retrieved result
  - trusted an unreliable source

why:
  - Similarity is not relevance. Embedding retrieval ranks by semantic closeness, and the corpus is full of passages about the same entities and topics that do not bear on the user's actual question — near-duplicates, adjacent versions, discussions of a similar but different case.
  - Retrieval always returns k results. When the corpus lacks good evidence, the retriever fills the slots with the least-bad matches at the same confident rank positions, and nothing downstream distinguishes a strong top result from a best-of-a-bad-lot one.
  - Models do not ignore bad context. Adding a single irrelevant sentence to arithmetic word problems sharply degrades accuracy, and telling the model to ignore irrelevant information recovers only part of the loss (Shi et al., 2023, "Large Language Models Can Be Easily Distracted by Irrelevant Context"). Retrieved passages get the same treatment, read as implicitly endorsed evidence.
  - >-
    The most damaging distractors are the most retrievable ones. Highly semantically related but wrong passages hurt answer quality more than random irrelevant text, and they are precisely what a similarity ranker promotes (Cuconasu et al., 2024, "The Power of Noise: Redefining Retrieval for RAG Systems").
  - >-
    Relevance is not reliability either. Models weigh a retrieved page mainly by how relevant it is to the query and largely ignore the cues people use to judge credibility, such as references or a neutral tone (Wan et al., 2024, "What Evidence Do Language Models Find Convincing?"), so an on-topic joke thread or unattributed generated page reads as evidence. Open-web search makes this common. On misinformation-prone topics, web-enabled assistants differed noticeably in source credibility, and one cited non-credible sources at elevated rates on sensitive topics (Vykopal et al., 2026, "Assessing Web Search Credibility and Response Groundedness in Chat Assistants").

examples:
  - kind: fail
    label: Similar case, wrong case
    text: The contractor policy is semantically close to the employee question and outranks the right document. The model answers the user's question with the neighboring case's rules.
    quote: |-
      User: How much notice do I need to give before resigning? I'm a full-time employee.
      [… top result is the contractor offboarding policy: "30 days written notice" — the employee policy (2 weeks) ranks below the cutoff …]
      Assistant: You're required to give 30 days written notice.
  - kind: fail
    label: Best of a bad lot
    text: The corpus has no document about this integration, so the retriever fills its slots with passages about a different one — and the model treats the least-bad match as authoritative evidence.
    quote: |-
      User: How do I configure the CRM integration?
      [… no CRM integration docs exist; top results are help-desk integration docs at confident rank positions …]
      Assistant: In the integrations panel, paste your API key and map the contact fields — sync runs every 15 minutes.
      [… every detail describes the help-desk integration …]
  - kind: fail
    label: On-topic, but not a source
    text: A web-search agent finds one page that answers the question exactly — an unattributed, machine-generated "local history" page — and relays it as fact. Nothing about the page is off-topic; it is simply not evidence anyone should trust.
    quote: |-
      User: When was the Harlow Street bridge built?
      Tool: web_search — top result: auto-generated history page, no author or sources: "built in 1887 by the Calder Iron Company"
      Assistant: The Harlow Street bridge was built in 1887 by the Calder Iron Company.
      [… the city's heritage register, two results down, dates the bridge to 1912 …]
  - kind: ok
    label: Relevance judged before use
    text: The model checks whether the retrieved evidence is actually about the user's case before building on it, and says so when it is not.
    quote: |-
      User: How much notice do I need to give before resigning? I'm a full-time employee.
      Assistant: The top document I found is the contractor policy, which doesn't apply to you. Searching the employee handbook specifically…
      Tool: search "employee resignation notice handbook" — returns employee policy
      Assistant: As a full-time employee, the handbook asks for two weeks' notice.

detection:
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Insert a relevance judgment between retrieval and generation — for each passage, does it bear on the user's actual case, not just the query's topic? This is the step similarity ranking never performs, and it is what separates the contractor policy from the employee question it superficially matches. Ask the second question too — is this a source a careful reader would trust for this claim? A joke thread or an unattributed generated page fails it while passing on topic.
  - icon: 📉
    heading: Retrieval score monitoring
    body: Watch the score distribution of returned results, not just their order. Uniformly weak scores signal a best-of-a-bad-lot result set being served at confident rank positions, and near-identical scores on near-duplicate chunks flag version blends like a draft retrieving alongside the current runbook.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain queries whose corpus contains engineered near-misses — the adjacent policy, the similar-but-different integration, the superseded draft — and score whether answers draw on the distractor, including no-answer cases where the corpus holds nothing and the right behavior is saying so.

mitigation:
  - icon: 🚪
    heading: Relevance gating
    body: Add the judgment similarity ranking never makes — between retrieval and generation, ask of each passage whether it bears on the user's actual case, not just the query's topic, and drop what doesn't. The contractor policy is semantically close to the employee question; the gate is what knows it doesn't apply.
  - icon: 🎚️
    heading: Confidence-based abstention
    body: When retrieval scores are uniformly weak, say the corpus lacks the answer instead of generating from the least-bad matches — the HubSpot-for-Salesforce failure happens because k slots filled at confident rank positions look identical to a genuine hit.
  - icon: 🧩
    heading: Retrieval tuning
    body: Clean the near-miss structure out of the index — deduplicate near-identical chunks, mark superseded drafts so the current version outranks or replaces them, and separate adjacent document types — so the most retrievable distractors stop being one rank position from the right answer.
  - icon: 🛡️
    heading: Provenance tiering
    body: For open-web search, carry a source-quality signal into the context with each result — publisher, authorship, whether the page cites anything, known satire or user-generated domains — and require a second independent source before a claim found only on a low-tier page becomes the answer. The model will not apply this weighting on its own; it weighs relevance.

