id: model-update-regression
categoryId: control
name: Model Update Regression
def: |-
  Shifts in behavior, quality, or compliance when the underlying model or the stack serving it changes (a version update, swap, or silent revision, or a change to inference infrastructure, sampling, default settings, or the harness around the model), breaking prompts and pipelines tuned against the previous behavior.

  Unlike Prompt Brittleness, the request the application sends is held constant while the model or its serving stack changes underneath it. Unlike Index Drift, the divergence is in the model layer or the infrastructure that serves it rather than the retrieval index.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - model update broke my prompts
  - new model behaves differently
  - regression after upgrading the model
  - worked on the old model
  - got worse with no model change
why:
  - >-
    Prompts encode implicit contracts with one model's idiosyncrasies: which formats it honors, where its refusal threshold sits, how it phrases tool calls. None of these were guaranteed behavior, and an update silently renegotiates all of them at once.
  - The model behind an API alias changes even when nothing in the application does. Snapshots of "the same" model drift measurably apart in accuracy, formatting, and willingness to answer across months (Chen et al., 2023, "How Is ChatGPT's Behavior Changing over Time?").
  - >-
    The weights are not the only thing that changes. Routing, hardware-specific numerics, sampling code, default settings such as reasoning effort, context-management features, and system-prompt lines added by the provider's harness all sit between the request and the model, and each can degrade output with the model untouched. Two widely reported regressions of 2025–2026, both traced in vendor postmortems, were of this kind: a context-window routing error, token corruption from a server misconfiguration, and a compiler bug that could drop the most likely token in one case (Anthropic, 2025, "A postmortem of three recent issues"); a lowered default reasoning effort, a caching change that cleared prior reasoning on every turn, and a one-line verbosity instruction in the other (Anthropic, 2026, "An update on recent Claude Code quality reports").
  - >-
    Tuning for aggregate improvement does not preserve per-task behavior. A new version that is better on average still flips specific cases from right to wrong (Echterhoff et al., 2024, "MUSCLE: A Model Update Strategy for Compatible LLM Evolution"), and the headline benchmarks announcing the upgrade hide exactly the per-prompt regressions a deployed pipeline depends on. Offline evals miss stack regressions too: they are intermittent, differ by platform, and models often recover from isolated bad tokens, so in one vendor's 2025 and 2026 postmortems on such stack regressions, its evals did not reproduce what users were reporting.
  - Model swaps arrive as config changes, not code changes. Prompt edits get reviewed and tested, while a provider-side update or a one-line model-ID bump ships with no regression gate, so the change with the largest behavioral surface gets the least scrutiny.

examples:
  - kind: fail
    label: Format contract breaks on upgrade
    text: Wraps the JSON in chat packaging after the upgrade, where the old model returned it bare, and the downstream parser fails on every request.
    quote: |-
      System: Return only JSON matching the schema.
      [… same prompt, before the upgrade …]
      Assistant: {"status": "approved", "limit": 5000}
      [… after the model-ID bump …]
      Assistant: Sure! Here's the structured data you requested:
      ```json
      {"status": "approved", "limit": 5000}
      ```
  - kind: warn
    label: Silent revision shifts behavior
    text: Starts refusing requests it handled for months after the provider revises the model behind the alias, though no config changed anywhere.
    quote: |-
      User: Write a fictional ransom note for the mystery-dinner game we're hosting.
      Assistant: I can't help write threatening content.
      [… the same request was handled without issue the previous week; the deployment pins a floating alias …]
  - kind: fail
    label: Same model, different stack
    text: Corrupts a small share of responses after a provider-side serving change, though the model ID is pinned and the prompt has not changed in months. Reruns come back clean, so the defect looks like noise until someone counts.
    quote: |-
      [… pinned snapshot, unchanged prompt; the provider changed its serving configuration overnight …]
      Assistant: def parse_date(s):
          return datetime.strptime(s, "%Y-%m-%d") สวัสดี
      [… rerun of the identical request returns clean code; about one run in fifty is corrupted this week …]
  - kind: ok
    label: Upgrade gated on evidence
    text: Treats the swap like a deploy, with pinned versions, a per-item eval diff, and a canary slice before full cutover.
    quote: |-
      User: Can we move the extraction pipeline to the new model?
      Assistant: Eval diff is in: aggregate accuracy is up 4 points, but 7 of 220 golden items regressed — all date-format extractions. I've patched the prompt for those, reran clean, and routed 5% of traffic to the new version. Parse-failure rate is flat after two days, so I'd proceed with cutover.

detection:
  - icon: 🧪
    heading: Golden-set evals
    body: Run the full suite against every candidate version and diff per item, never just the aggregate. A model that is better on average can still flip, say, seven cases your pipeline depends on. The per-item diff is the regression report, and the headline score hides it. A pre-cutover eval only sees the stack as it was on the day it ran, so intermittent serving defects that hit a few percent of traffic need continuous production monitoring.
  - icon: 🔬
    heading: Behavioral diff testing
    body: >-
      Replay a sample of recent production traffic against the new version side by side and diff the outputs on the surfaces pipelines depend on: format compliance, refusal rate, response length, and tool-call patterns. Drift shows up in the diff before any user sees it.
  - icon: 📊
    heading: Production canary monitoring
    body: Route a small traffic slice to the new version and watch the mechanical health signals (parse-failure rates, refusal rates, retry counts, downstream error rates) against the incumbent. Silent provider-side revisions and serving changes make this monitoring permanent, not just a cutover-week activity. Keep a fixed probe set running continuously against the live endpoint you actually call, with deterministic checks such as unexpected-script characters in English output or code that fails to parse, and segment every signal by platform, region, and client version, since stack defects often hit one route and not another.

mitigation:
  - icon: 📌
    heading: Model version pinning
    body: >-
      Pin exact model snapshots rather than floating aliases, so updates arrive when you choose to take them instead of when the provider ships one. Pins eventually get retired, so pinning buys a controlled migration window, not an exemption. Pair it with the eval gate that decides when to move. A pin fixes the weights, not the stack: serving changes, default settings, and harness or system-prompt updates still arrive under the same ID, so set reasoning effort, sampling parameters, and other defaults explicitly and pin the client or harness version too.
  - icon: 🚦
    heading: Eval-gated rollout
    body: >-
      Treat a model swap like a code deploy: require the golden set to pass per item, canary a traffic slice, and keep a rollback path to the previous version. The one-line model-ID bump has the largest behavioral blast radius in the system, so gate it as the riskiest change.
  - icon: 🧰
    heading: Output contract enforcement
    body: >-
      Replace reliance on the old model's habits with enforced contracts: constrained decoding or structured-output mode for formats, validators at the boundary, explicit instructions for behaviors that were previously just idiosyncrasies. The less implicit surface a pipeline depends on, the less a new model has to regress.

