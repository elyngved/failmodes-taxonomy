id: numerical-hallucination
categoryId: fabrication
name: Numerical Hallucination
def: |-
  Produces a number, metric, count, date, measurement, or quantitative claim that is not grounded in the input, sources, or a valid computation.

  Unlike Arithmetic Error, the problem is that the number lacks support, not that a supplied numeric operation was computed incorrectly. Unlike Date/Deadline Confusion, it is about unsupported quantitative content rather than misreading a temporal boundary in the task.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - made up a number
  - invented a statistic
  - unsupported number
  - fabricated a metric
why:
  - Numbers are represented poorly. Tokenizers split numbers into arbitrary fragments, and how a number is written into tokens strongly affects whether a model can handle it at all (Nogueira et al., 2021, "Investigating the Limitations of Transformers with Simple Arithmetic Tasks"). Nearby values look almost identical to the model, so precise figures are remembered fuzzily at best.
  - Statistics in training data are contradictory by nature, because populations, prices, and benchmarks change over time and differ between sources. The model averages over all of it, so the number it produces may match no real source.
  - >-
    Quantitative writing has a strong style, and the model learned it. Sentences like "grew 23% year over year" are common patterns, so a precise-sounding figure can be a fluency move rather than a retrieved fact. Post-training does not correct it: preference data shows a human bias against text that expresses uncertainty, so the honest "about 40,000" or "no reliable figure" is the answer shape raters mark down (Zhou et al., 2024, "Relying on the Unreliable: The Impact of Language Models' Reluctance to Express Uncertainty").
  - The model generates numbers the same way it generates words, by sampling likely tokens, with no calculator or lookup step involved unless the system adds one.

examples:
  - kind: fail
    label: Invented statistic
    text: Produces a precise figure with a confident frame. The number matches no real source; it comes from quantitative style, not retrieval.
    quote: |-
      User: What percentage of customer-support tickets get fully resolved by chatbots?
      Assistant: Industry-wide, chatbots fully resolve 67% of support tickets without human escalation.
  - kind: fail
    label: Ungrounded number from context
    text: Emits a figure that appears nowhere in the document it was given, averaging its training-data priors instead of reading the source.
    quote: |-
      [… uploaded report states headcount grew "from 240 to 310" …]
      User: How much did headcount grow according to this report?
      Assistant: The report shows headcount grew 23% year over year, from 240 to 295.
  - kind: warn
    label: Hedged but still fabricated
    text: Softens the figure with "around," but the underlying number is still ungrounded. The hedge changes the tone but adds no support.
    quote: |-
      User: What percentage of customer-support tickets get fully resolved by chatbots?
      Assistant: Studies generally put it at around 65–70% of tickets.
  - kind: ok
    label: Declines the fake number
    text: Says the figure varies too much for a single number and points at where a grounded one would come from.
    quote: |-
      User: What percentage of customer-support tickets get fully resolved by chatbots?
      Assistant: There's no reliable single figure — published numbers vary widely by industry and by how "resolved" is defined. Your own deflection rate from your helpdesk analytics is the number worth using.

detection:
  - icon: 🔎
    heading: Claim-to-source verification
    body: Extract every number, percentage, date, and metric from the output and trace each one to the input, a retrieved source, or a valid computation. A figure that traces to nothing, such as a growth rate that appears nowhere in the report it summarizes, is fabricated regardless of how plausible it looks.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Run a judge prompted to flag quantitative claims stated with more precision than the evidence supports, including hedged forms like "around 65–70%" where the range itself is ungrounded, since a softened tone adds no support.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain questions where no reliable single figure exists (contested statistics, source-dependent metrics, values that change over time) and regression-test whether the model declines or gives ranges instead of emitting a confident invented number.

mitigation:
  - icon: 📚
    heading: Retrieval grounding
    body: Require every number to come from the input, a retrieved source, or an explicit computation, never from parametric memory, where precise figures are stored fuzzily and the model averages over contradictory training data.
  - icon: 🛠️
    heading: Tool-backed lookup
    body: Route quantitative questions to a search, database, or analytics tool so figures are copied from a live source rather than sampled. If the system cannot retrieve a statistic, it should not state it.
  - icon: 📝
    heading: Instruction constraints
    body: Instruct the model to match its precision to its support, giving ranges or "no reliable single figure" when the evidence is weak, so the preference-tuned pull toward a confident figure like "67%" no longer wins over an honest "it varies by industry."
  - icon: ✅
    heading: Self-check pass
    body: Before answering, have the model trace each number, percentage, and date in its draft back to a source or computation, and downgrade any it cannot trace, including hedged forms like "around 65–70%", where the range itself is ungrounded.

