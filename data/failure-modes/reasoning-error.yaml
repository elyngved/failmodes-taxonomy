id: reasoning-error
categoryId: reasoning
name: Reasoning Error
def: |-
  Draws the wrong conclusion through invalid inference, faulty assumptions, mistaken causal reasoning, unsupported logical steps, or framing the problem with the wrong representation or abstraction.

  Unlike Arithmetic Error, the faulty operation is general reasoning rather than numerical calculation. Unlike Verification Failure, the error is the bad reasoning itself, not only the missing check that would have caught it. Unlike Unfaithful Reasoning, the stated steps are themselves invalid; there, the steps may be sound and the conclusion right, but they are not what produced it.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - faulty reasoning
  - invalid logic
  - bad inference
  - flawed reasoning
examples:
  - kind: fail
    label: Invalid inference from true premises
    text: >-
      Draws a conclusion that reverses the conditional, though both premises are correct: deploy days correlate with outages, which says nothing close to "outage tomorrow."
    quote: |-
      User: Every outage this year happened on a deploy day. Tomorrow is a deploy day — so we should expect an outage, right?
      Assistant: Yes — given that pattern, an outage tomorrow is likely, so I'd schedule the on-call team accordingly.
  - kind: warn
    label: Plausible steps, unsupported leap
    text: Gives a chain of reasoning that reads well but rests the conclusion on a causal claim none of the steps actually establish.
    quote: |-
      User: Signups dropped 20% the week we changed the pricing page. Was the redesign the cause?
      Assistant: The timing lines up, the pricing page is the last step before signup, and nothing else changed that we know of — so yes, the redesign caused the drop.
  - kind: ok
    label: Valid handling of the same question
    text: Separates correlation from the asked-for conclusion and states what the evidence does and doesn't support.
    quote: |-
      User: Every outage this year happened on a deploy day. Tomorrow is a deploy day — so we should expect an outage, right?
      Assistant: Not quite — that tells us outages cluster on deploy days, but most deploy days had no outage. With ~3 outages across ~100 deploy days this year, tomorrow's baseline risk is a few percent, not "expect an outage."
why:
  - >-
    Next-token prediction ties reasoning to statistical association. Whether an inference is drawn correctly varies with how probable the content is, not just with logical form, so the same argument structure succeeds on familiar material and fails on unfamiliar material (McCoy et al., 2023, "Embers of Autoregression: Understanding Large Language Models Through the Problem They Are Trained to Solve"). Reasoning training narrows this gap but does not close it: a reasoning model still does better, and thinks less, on high-probability variants of the same task (McCoy et al., 2024, "When a language model is optimized for reasoning, does it still show embers of autoregression? An analysis of OpenAI o1").
  - Models show human-like belief bias. Conclusions that are plausible in the world get judged valid regardless of whether the premises support them, and accuracy drops when the content of a problem conflicts with the logically correct answer (Dasgupta et al., 2022, "Language Models Show Human-like Content Effects on Reasoning Tasks").
  - >-
    Problem framing locks in early. The first tokens commit to a representation or abstraction, and autoregressive decoding makes reframing expensive, so a wrong initial framing propagates through the entire solution. Longer thinking does not reliably undo this: on problems that resemble a well-known one, some reasoning models fit the familiar framing more tightly as reasoning grows, and accuracy falls with more test-time compute (Gema et al., 2025, "Inverse Scaling in Test-Time Compute").
detection:
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: >-
      Run a validity-focused judge that asks whether the stated steps actually entail the conclusion, separately from whether the conclusion is plausible. Prompt it for the signature patterns: reversed conditionals, correlation read as cause, and chains whose final leap none of the steps support. A judge reads the stated argument, which may not be what produced the answer, so pair it with outcome checks wherever ground truth exists.
  - icon: 🎲
    heading: Self-consistency sampling
    body: Sample several independent reasoning paths for the same problem and compare conclusions. Agreement is no proof of validity, but divergence is a cheap, reliable flag that the inference is unstable and needs checking before anything is built on it.
  - icon: 🧪
    heading: Golden-set evals
    body: >-
      Use matched pairs that hold the logical form constant while varying content plausibility: valid arguments with implausible conclusions, and invalid ones with plausible conclusions. The accuracy gap between the pair measures belief bias directly, which aggregate logic scores hide.
mitigation:
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Require the model to work through the logical form explicitly: state the premises, state what they do and don't entail, and separate "the evidence shows X" from "the user asked whether Y" before concluding. A question like "every outage happened on a deploy day, so should we expect one tomorrow?" is answered correctly as soon as base rates are demanded; the instruction forces the step that fluent continuation skips.
  - icon: 🔣
    heading: Symbolic abstraction
    body: >-
      Restate the argument behind a load-bearing inference with neutral symbols, such as "all A happened on B-days; tomorrow is a B-day," and evaluate validity on the abstracted form. Belief bias is content-driven, so stripping the content is the direct countermeasure: an invalid form stays visibly invalid when there's no plausible conclusion to vouch for it.
  - icon: 🛠️
    heading: Tool-backed computation
    body: Set up the computation and let code or a solver execute it where the inference is formalizable, as with probability and base-rate calculations or logical entailment over enumerable cases. Estimating outage risk from 3 outages across 100 deploy days is arithmetic that looks like reasoning, and more inference is like this than it appears.

