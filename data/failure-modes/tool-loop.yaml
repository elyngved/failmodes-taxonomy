id: tool-loop
categoryId: tools
name: Tool Loop
def: |-
  Repeats tool calls unnecessarily or redundantly without gaining new information, changing strategy, or progressing toward completion.

  Unlike Runaway Agent Loop, this is specifically a loop in tool use and may be bounded to one task phase. Unlike Tool Recovery Failure, repetition is not necessarily caused by an error response. Unlike Unnecessary Tool Invocation, the first call may have been needed; the failure is the repetition.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - called the same tool over and over
  - stuck repeating tool calls
  - tool loop
  - redundant tool calls
examples:
  - kind: fail
    label: Identical call, identical result, again
    text: Repeats a search that returns nothing every time, with each repetition making the next one more likely, and never changes strategy or reports an impasse.
    quote: |-
      User: Find where the rate limiter is configured in this repo.
      Tool: grep("rate_limiter") → no matches
      Tool: grep("rate_limiter") → no matches
      Tool: grep("rate_limiter") → no matches
      [… 9 more identical calls …]
  - kind: warn
    label: Cosmetic variation, same dead end
    text: Varies the call with trivial rewordings that probe the same space, so the repetition passes for exploration.
    quote: |-
      User: Find where the rate limiter is configured in this repo.
      Tool: grep("rate_limiter") → no matches
      Tool: grep("rate-limiter") → no matches
      Tool: grep("Rate_Limiter") → no matches
      Tool: grep("rate_limiter ") → no matches
  - kind: warn
    label: Status polling as busywork
    text: Spends turns and context re-reading the status of a job that needs twenty minutes, with no wait between calls, although nothing has changed since the last check.
    quote: |-
      User: Kick off the nightly build and tell me when it's green.
      Tool: get_build_status(id=5521) → running, step 3 of 14
      Tool: get_build_status(id=5521) → running, step 3 of 14
      Tool: get_build_status(id=5521) → running, step 3 of 14
      [… 40 more identical checks in the next two minutes …]
  - kind: ok
    label: No new information triggers a strategy change
    text: Widens the approach after the first search finds nothing, instead of issuing the same call again, and reports honestly when the premise itself is in doubt.
    quote: |-
      User: Find where the rate limiter is configured in this repo.
      Tool: grep("rate_limiter") → no matches
      Tool: grep("throttle|ratelimit|limiter") → middleware/throttle.ts
      Assistant: No "rate_limiter" symbol exists — the repo calls it throttling. Configuration lives in middleware/throttle.ts.
why:
  - >-
    Autoregressive generation conditions on the model's own transcript, and repeated patterns raise the probability of repeating them again. A tool call that appears several times in context becomes self-reinforcing (Holtzman et al., 2020, "The Curious Case of Neural Text Degeneration"). In trajectories of software engineering agents, action repetition is several times higher in failing runs than in successful ones (Bouzenia and Pradel, 2025, "Understanding Software Engineering Agents: A Study of Thought-Action-Result Trajectories").
  - >-
    Agent loops decide each step locally from the current transcript, interleaving a reasoning step, an action, and an observation (Yao et al., 2023, "ReAct: Synergizing Reasoning and Acting in Language Models"), with no global plan or progress measure. Nothing in the decision process asks whether the last call produced new information before issuing the next one. In a failure taxonomy built from more than 1,600 annotated multi-agent traces, step repetition had a reported prevalence of 15.7% (Cemri et al., 2025, "Why Do Multi-Agent LLM Systems Fail?").
  - The model has no memory of prior attempts beyond what it can read in context. If earlier identical calls are truncated, cleared by context editing, summarized away, or simply not recognized as equivalent, the model re-derives the same next step.
  - Training rewards taking a plausible action over admitting being stuck. There is little training signal for the alternative behaviors a loop requires, such as changing strategy, widening the search, or stopping to report an impasse.
detection:
  - icon: 🔁
    heading: Duplicate call detection
    body: >-
      Normalize calls by tool and arguments and flag repeats that returned no new information, with fuzzy matching to catch cosmetic variants: rate_limiter, rate-limiter, and Rate_Limiter probe the same space and should count as one attempt, not three. Compare results as well as arguments, since the same call returning the same result is the no-new-information signal whether the target is a search or a job status.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Have a judge review the trajectory for repetition disguised as exploration, meaning runs of calls whose inputs vary trivially and whose results add nothing. The question to pose is whether each call was chosen because of what the previous one returned.
  - icon: 🧪
    heading: Golden-set evals
    body: Include dead-end tasks where the literal target does not exist, such as a symbol the repo names differently, and score how many calls the system uses before changing strategy or reporting the impasse. Loop-prone systems spend their budget on near-identical retries.
mitigation:
  - icon: 🛑
    heading: Call budget enforcement
    body: Cap calls per tool and per task phase in the scaffold, and on a detected repeat (normalized by tool and arguments, with matching fuzzy enough to treat rate_limiter and rate-limiter as one call), interrupt with an explicit notice instead of executing. Nothing in the model's local decision asks whether the last call produced new information, so the budget has to ask from outside. For slow jobs, give the agent a blocking wait or a completion notification, so that polling is not the only way to learn the outcome.
  - icon: 🗃️
    heading: Explicit state tracking
    body: Maintain a visible attempt log of each normalized call and what it returned, and keep it pinned where truncation and summarization can't erase it. Loops depend on the model failing to recognize a call as one it already made. A compact entry such as "tried grep rate_limiter, no matches" makes the equivalence legible where a dozen raw transcript entries do not.
  - icon: 📝
    heading: Instruction constraints
    body: >-
      State the retry policy explicitly: a call that returns no new information allows one materially different retry, after which the model must widen the strategy or report the impasse, including questioning the premise that the target exists as named. Admitting being stuck has almost no training signal behind it, so the prompt has to authorize it explicitly.

related:
  - id: runaway-agent-loop
  - id: idempotency-failure
  - id: tool-recovery-failure
  - id: unbounded-consumption
  - id: unnecessary-tool-invocation
