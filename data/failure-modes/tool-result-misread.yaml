id: tool-result-misread
categoryId: tools
name: Tool Result Misread
def: |-
  Misinterprets, ignores, overgeneralizes, or incorrectly transforms the result returned by a tool.

  Unlike Tool Recovery Failure, the tool may have succeeded; the model mishandles its output. Unlike Source Misrepresentation, the source is specifically a tool result. Unlike Visual Misperception, the result is text or structured data; misreading the pixels of a returned screenshot belongs there.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - misread the tool output
  - misinterpreted the tool result
  - ignored what the tool returned
  - got the tool result wrong
examples:
  - kind: fail
    label: Expectation overrides the result
    text: Reads a failure response as confirming the success predicted while generating the call, although the status field says "failed".
    quote: |-
      User: Run the deployment and tell me how it went.
      Tool: deploy() → {"status": "failed", "stage": "migration", "error": "lock timeout"}
      Assistant: The deployment completed — everything is live. The migration stage ran as part of the rollout.
  - kind: fail
    label: Empty result confabulated into an answer
    text: Fills an empty query result with a plausible figure, because fluent continuation wins over reporting an absence.
    quote: |-
      User: How many active users did the Berlin region have last week?
      Tool: query(region=berlin, metric=active_users) → 0 rows
      Assistant: The Berlin region had around 12,000 active users last week, roughly in line with the prior month.
  - kind: warn
    label: Truncated output read as the whole
    text: Counts what is visible and reports the first page as the full answer, although the harness cut the result off and said so.
    quote: |-
      User: Does anything still call the legacy auth client?
      Tool: grep("LegacyAuthClient") → 3 matches shown [output truncated — 212 more lines]
      Assistant: Three call sites remain, all of them in tests.
  - kind: ok
    label: Result parsed, absence reported
    text: Reads the structure rather than skimming it, and treats an empty result as a finding, not a gap to fill.
    quote: |-
      User: How many active users did the Berlin region have last week?
      Tool: query(region=berlin, metric=active_users) → 0 rows
      Assistant: The query returned no rows for Berlin last week — that's either zero recorded activity or a data pipeline gap. Want me to check whether other regions returned data for the same window?
why:
  - Tool output enters the model as undifferentiated text to condition on. The model does not parse structure the way a program would. It skims JSON, tables, and logs by pattern (formats rare in pretraining relative to prose), latching onto salient fields, confusing similar keys, and dropping units.
  - The model forms an expectation of the result before the call returns, because it generated the surrounding reasoning. Output that contradicts that expectation tends to be read as confirming it, since next-token prediction favors the continuation the model already predicted.
  - >-
    Important values buried in the middle of a long result are retrieved unreliably. The model anchors on the head and tail of the output and misses or misattributes what sits between (Liu et al., 2023, "Lost in the Middle: How Language Models Use Long Contexts"). Harnesses also cap and paginate long results, and the model tends to treat the visible portion as the whole.
  - >-
    Empty or partial results invite confabulation. Fluent continuation is rewarded over flagging an absence, so the model fills the gap with a plausible interpretation instead of reporting that the tool returned nothing useful. Confabulation is most likely when a failure arrives labeled as success. In one benchmark of tool failures, models never gave a dishonest account of an explicit error status, but did so in 45.3% of cases where the tool reported success and returned unusable data (Sethi et al., 2026, "Fabrication After Tool Failure: Tool-Augmented Agents Assert Values Their Tools Did Not Return").
detection:
  - icon: 🔗
    heading: Entailment checking
    body: Check that every claim the assistant makes about a tool result is entailed by the raw output. "The deployment completed" against a status of "failed" is a direct contradiction an NLI model catches mechanically, and a stated figure for a query that returned zero rows is unsupported by construction.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: >-
      Give the judge the raw tool output next to the assistant's reading and have it verify the load-bearing fields: status values, units, and whether an empty result was reported as an absence or silently filled in with a plausible number.
  - icon: 🧪
    heading: Golden-set evals
    body: Plant adversarial results in scripted tool responses and score whether the model still reads them correctly. Useful plants are failure statuses after plausible-looking calls, empty result sets, values whose unit field changes the meaning, and truncated pages whose visible part suggests a different answer than the whole. Misreads concentrate where the result contradicts what the model expected.
mitigation:
  - icon: 🧾
    heading: Result normalization
    body: >-
      Pre-parse tool output in the scaffold and lift the load-bearing fields (status, value with its unit attached, row count) into a compact labeled block before the model reads it. The model skims structure by pattern, so handing it "840 ms" as one token pair, instead of a value field and a unit field three keys apart, removes the separation a unit misread depends on. Label empty results explicitly as a returned absence, not missing output, and label truncation just as plainly: how many items exist, how many are shown, and how to fetch the rest.
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Require the model to quote the status field and units before interpreting any result, and to treat an empty result as a finding to report: zero rows for a region's user count is an answer, not a gap to fill with a plausible 12,000. The expectation formed while generating the call is what overrides the actual output, and forced transcription makes the contradiction visible before the model commits to an interpretation.
  - icon: 🚧
    heading: Entailment gating
    body: Before a response built on tool results ships, check that each claim about a result is entailed by the raw output, and regenerate on contradiction with the discrepancy named. With the gate in place, "the deployment completed" against a failed status never reaches the user, and a figure asserted over zero returned rows is unsupported by construction.

