id: version-hallucination
categoryId: freshness
name: Version Hallucination
def: |-
  Confuses, invents, or misapplies product, model, package, API, policy, dataset, or document versions.

  Unlike Temporal Hallucination, the error is specifically about version identity or version-specific behavior. Unlike Code/API Hallucination, the interface may exist in another version rather than being entirely invented.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - wrong version
  - mixed up versions
  - used the wrong API version
  - version doesn't exist

why:
  - >-
    Training corpora mix a product's whole release history without separating its versions. Documentation, tutorials, and Q&A for every release coexist without version labels, so the model learns a blended interface that matches no single release. Benchmarks find current models largely version-oblivious: accuracy drops on APIs that changed across releases while holding steady on stable ones (Cipollone et al., 2026, "LibEvoBench: Probing Temporal Knowledge Stratification in Code Generation Models").
  - Sheer volume favors older versions. A long-lived release accumulates years of blog posts and Stack Overflow answers while the current one has months, so likelihood-weighted generation pulls toward superseded APIs and defaults.
  - Models extrapolate version numbering patterns. Having seen v1 through v4, the model will fluently discuss a plausible v5 (features, dates, and migration notes included), because plausible continuation is what pretraining optimizes, and training and evaluation that score a confident guess above "I don't know" keep it that way (Kalai et al., 2025, "Why Language Models Hallucinate").
  - >-
    Systems rarely pin context to the user's actual version, and naming the version is not enough on its own. Without a lockfile or a docs lookup the model has no signal to disambiguate, and nothing downstream verifies that a cited API exists in the version in use. In one benchmark, stating the target version in the prompt gave no measurable benefit, while supplying that version's documentation significantly improved accuracy (Cipollone et al., 2026, "LibEvoBench: Probing Temporal Knowledge Stratification in Code Generation Models").

examples:
  - kind: fail
    label: Superseded API recommended as current
    text: Confidently recommends an API that was removed in the previous major version, because years of older-version content outweigh the current docs.
    quote: |-
      User: How do I define URL routes in Django 5?
      Assistant: Use the url() function from django.conf.urls with a regex pattern for each route.
      [… url() was superseded by path() and re_path() in Django 2.0, deprecated in 3.1, and removed in 4.0 …]
  - kind: fail
    label: Extrapolated version
    text: Extrapolates from the version sequence and fluently describes the next release, features and migration notes included, though that version does not exist.
    quote: |-
      User: Should we wait for React 20 before migrating?
      Assistant: React 20 mainly stabilizes the concurrent compiler and removes the legacy context API, so the migration from 19 is small. Waiting for it is reasonable.
      [… no React 20 has been announced; every detail is extrapolated …]
  - kind: warn
    label: Version-sensitive answer, version never pinned
    text: Happens to describe one major version's behavior, but never asks which version the user runs or says which one the answer describes.
    quote: |-
      User: Why is my pydantic model ignoring the config options?
      Assistant: You need to set the options in the model_config dict on your class.
      [… correct for pydantic v2 only; the user's traceback later shows they are on v1 …]
  - kind: ok
    label: Version pinned before answering
    text: Treats the version as load-bearing, pins it from the user's environment, and then scopes the answer to that release.
    quote: |-
      User: Why is my pydantic model ignoring the config options?
      Assistant: This depends on your major version — config moved in v2. What does pip show pydantic say?
      User: 1.10.13
      Assistant: On v1, config goes in a nested class Config on the model, not model_config — that dict is v2-only and v1 silently ignores it.

detection:
  - icon: 🔎
    heading: Version existence lookup
    body: >-
      Resolve every named version against the registry or release history, and every recommended API against the changelog of the version actually in use. This check catches errors in both directions: a fluently described React 20 that was never announced, and a url() recommendation that exists only in releases the user left behind.
  - icon: ⚙️
    heading: Sandboxed execution
    body: Run generated code against the user's pinned version (from their lockfile or environment, not the latest release). Version-blended advice that imports removed functions or sets options another major version ignores fails immediately, where running against latest would mask the mismatch.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain version-sensitive prompts with the target version pinned (questions where v1 and v2 answers diverge, removed-API traps, and probes about plausible future versions), and regression-test that answers match the pinned release and decline to describe versions that do not exist.

mitigation:
  - icon: 📌
    heading: Context pinning
    body: Put the user's actual version in context (from the lockfile, pip show, or an explicit question) before answering anything version-sensitive, and use it to select what goes into context. In one benchmark, a version number alone gave no measurable benefit; its value is in fetching that release's docs and checking APIs against that release's changelog. Coding agents can read the version straight from the lockfile instead of asking.
  - icon: 📚
    heading: Retrieval grounding
    body: Ground answers in documentation retrieved for the pinned version specifically, not the blended interface in the weights. Docs scoped to the release in use let the model choose Django's path() over the url() function that years of older tutorials make statistically dominant.
  - icon: 📝
    heading: Instruction constraints
    body: Instruct the model to ask which version the user runs when the answer diverges across releases, to name the version its answer targets, and to decline to describe unreleased versions. A fluent React 20 migration guide is extrapolation, not recall, and the model should refuse to write one.

related:
  - id: temporal-hallucination
  - id: code-api-hallucination
  - id: outdated-source-reliance
