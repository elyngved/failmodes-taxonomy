id: overthinking
categoryId: reasoning
name: Overthinking
def: |-
  Spends far more reasoning than the problem warrants: long deliberation on trivial questions, redundant re-derivations, or second-guessing that talks the model out of a correct answer.

  Unlike Verbosity Failure, the excess is in the reasoning process and its token and latency cost, not the final answer's length. Unlike Unbounded Consumption, the spend terminates on its own; it is disproportionate rather than unlimited, and the harm can include a worse answer, not just a bigger bill. Unlike Unnecessary Tool Invocation, the excess is in reasoning, not in calls.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - thought way too long
  - overthought a simple question
  - reasoned itself out of the right answer
  - burned tokens thinking
why:
  - >-
    Reasoning training rewards long chains. Test-time scaling teaches that more thinking improves hard-problem success, and the learned policy applies extended deliberation indiscriminately, including to simple problems where the first solution attempt is already correct more than 92% of the time (Chen et al., 2024, "Do NOT Think That Much for 2+3=? On the Overthinking of o1-Like LLMs").
  - Allocating a thinking budget requires estimating difficulty before solving, which is itself the judgment the thinking was supposed to produce. With no reliable difficulty signal, the trained default is to deliberate.
  - >-
    Extended reasoning can make answers worse, not just slower. Models second-guess correct intermediate conclusions, drift to alternative framings, and in agentic settings substitute simulating outcomes for taking the one cheap action that would settle the question (Cuadron et al., 2025, "The Danger of Overthinking: Examining the Reasoning-Action Dilemma in Agentic Tasks"). Purpose-built tasks show accuracy falling as test-time compute rises, through distraction by irrelevant detail, drift from sound priors to spurious correlations, and lost focus on long deductions (Gema et al., 2025, "Inverse Scaling in Test-Time Compute").
  - >-
    Much of the extra budget re-checks an answer already reached. Reflection after the first candidate answer mostly confirms it and rarely changes it, so truncating reasoning once a candidate appears cut tokens by about a quarter at a small accuracy cost (Kang et al., 2025, "First Try Matters: Revisiting the Role of Reflection in Reasoning Models").
  - Reasoning traces are often hidden or unread, so the cost is invisible in the feedback loop. Raters and evals score the final answer, and nothing charges for the reasoning behind it, such as 2,400 tokens spent on a one-line percentage.

examples:
  - kind: fail
    label: Trivial question, massive deliberation
    text: Gets the answer right, but only after thousands of reasoning tokens and many seconds of latency that a one-line computation never needed.
    quote: |-
      User: What's 15% of 80?
      [… model reasons for 2,400 tokens — computes 0.15 × 80, re-derives it via 10% + 5%, cross-checks by computing 80 × 3/20, then reverifies each method …]
      Assistant: 12.
  - kind: fail
    label: Second-guessed out of the right answer
    text: Reaches the correct conclusion first, keeps deliberating until a plausible alternative surfaces, and talks itself into it.
    quote: |-
      User: Which config change caused the latency spike — A, B, or C?
      [… reasoning trace: "B aligns with the timeline exactly… but wait, let me reconsider C…" 1,800 tokens later …]
      Assistant: It was C — the connection-pool change.
      [… B was correct, and the trace had established it before the reconsideration began …]
  - kind: warn
    label: Simulation instead of action
    text: Spends its turn reasoning about what a tool call would probably return when one cheap call could settle the question.
    quote: |-
      User: Is the staging deploy finished?
      Assistant: Based on the deploy starting around 14:02 and typical build times of 6–9 minutes, accounting for the cache being warm, it has most likely completed by now — though the migration step can add time…
      [… a one-line status check tool was available the entire time …]
  - kind: ok
    label: Effort matched to difficulty
    text: Answers the trivial part directly and spends the deliberation budget on the part that needs it.
    quote: |-
      User: What's 15% of 80, and which of these three configs caused the latency spike?
      Assistant: 15% of 80 is 12. The config question needs actual care — comparing each change's timestamp against the spike onset… Change B landed at 14:01, ninety seconds before the spike, and it's the only one touching the request path. It's B.

detection:
  - icon: 📊
    heading: Reasoning budget monitoring
    body: Track reasoning tokens per request against task class and outcome, and flag the distribution's tail, especially spend on items a no-reasoning baseline already answers correctly. A 2,400-token answer to a percentage question is caught by metering alone, with no quality judgment needed.
  - icon: 📉
    heading: Accuracy-versus-length auditing
    body: Chart correctness against reasoning length on a labeled set. Accuracy that falls as traces grow is second-guessing measured directly, and diffing traces against final answers finds the cases where a correct intermediate conclusion was deliberated away.
  - icon: 🧪
    heading: Golden-set evals
    body: >-
      Include deliberately trivial items alongside hard ones and score budget proportionality, not just correctness: tokens-to-answer on the easy half, accuracy on the hard half. A system tuned only on hard-problem accuracy will pass while burning its budget on the items that needed none.

mitigation:
  - icon: 🚦
    heading: Difficulty-based routing
    body: Route requests by estimated difficulty, sending trivial queries to a cheap or no-reasoning path and reserving extended thinking for problems that earn it, using the reasoning-effort controls most providers now expose. The model won't self-allocate; the router has to.
  - icon: 🛑
    heading: Thinking budget caps
    body: >-
      Set per-request reasoning-token budgets matched to task class, forcing commitment when the budget is spent. Capping also bounds the second-guessing window: a reconsideration that talks the model out of a correct answer needs room to happen in, such as 1,800 tokens.
  - icon: 📝
    heading: Instruction constraints
    body: Instruct the model to answer directly when confident, to stop at the first verified conclusion rather than re-deriving it by other methods, and, in agentic settings, to prefer one cheap observation over reasoning about what the observation would show. "Check the deploy status" beats a paragraph estimating it.

