id: tool-argument-error
categoryId: tools
name: Tool Argument Error
def: |-
  Calls a tool with arguments that are malformed, incomplete, unauthorized, stale, poorly scoped, or semantically wrong for the intended operation.

  Unlike Wrong Tool Selection, the chosen tool may be appropriate while the call parameters are not. Unlike JSON/Schema Failure, the malformed structure is sent to a tool rather than returned as final output. Unlike Environment Misidentification, the wrong value is in the call; there the call is right for the intended target and the name resolves to a different resource.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - wrong tool arguments
  - bad parameters to the tool
  - called the tool with wrong inputs
  - malformed tool call
examples:
  - kind: fail
    label: Plausible value invented
    text: Lacks the customer's ID, so fills the argument slot with a fabricated one that looks right and silently operates on the wrong account.
    quote: |-
      User: Pull up the subscription details for Meridian Labs.
      Tool: get_subscription(customer_id="cust_meridian_001") → returns a different company that happens to own that ID
      Assistant: Meridian Labs is on the Starter plan at $49/month.
  - kind: fail
    label: Stale value replayed
    text: Copies the deploy target from an earlier call after the user switched it mid-session, instead of taking it from the current state.
    quote: |-
      User: Actually, deploy to the EU cluster instead — we just discussed this.
      Assistant: Deploying now.
      Tool: deploy(cluster="us-east-1") → deployed
      [… the argument was copied from the previous deploy call, not the updated instruction …]
  - kind: warn
    label: Missing parameter guessed silently
    text: Picks a default for a required scope the user never specified instead of asking, and the default happens to be far broader than intended.
    quote: |-
      User: Grant the contractor access to the project.
      Tool: grant_access(user="contractor@ext.com", scope="org-admin")
      Assistant: Done — access granted.
  - kind: ok
    label: Unknown value looked up, not guessed
    text: Treats the ID as something to resolve, not generate, and looks it up before the call.
    quote: |-
      User: Pull up the subscription details for Meridian Labs.
      Tool: search_customers("Meridian Labs") → cust_8842
      Tool: get_subscription(customer_id="cust_8842") → Enterprise, $2,400/month
      Assistant: Meridian Labs (cust_8842) is on Enterprise at $2,400/month.
why:
  - >-
    Arguments are generated by the same next-token process that hallucinates facts. Even strong models struggle to generate accurate input arguments for API calls and tend to hallucinate the wrong API usage (Patil et al., 2023, "Gorilla: Large Language Model Connected with Massive APIs"). When the model does not know a value, it fills in a plausible-looking one, producing fabricated IDs, paths, and parameters.
  - >-
    Schema enforcement constrains syntax, not semantics. Strict modes and constrained decoding now guarantee arguments that parse and match the declared types, which moves the remaining errors into the values. A schema cannot verify that a file exists, an ID is current, or a scope is appropriate. Nor can it express usage conventions such as when to include optional parameters, which combinations make sense, or what format a date or identifier takes (Anthropic, 2025, "Introducing advanced tool use on the Claude Developer Platform").
  - >-
    Values must often be copied from earlier in a long transcript, and retrieval from the middle of a long context is unreliable. The model grabs a similar-looking value from the wrong place or misreads the right one (Liu et al., 2023, "Lost in the Middle: How Language Models Use Long Contexts"). Passing a large result from one call into the next has the same weakness, because the model has to re-emit the data token by token and can drop or alter part of it (Anthropic, 2025, "Code execution with MCP: Building more efficient agents").
  - >-
    Conversation state changes as a task progresses, but the model has no mechanism marking which earlier values are stale. Arguments correct at one step get replayed after the underlying state has moved on. Function-calling benchmarks find that current models handle single-turn calls well and still struggle in stateful, multi-step settings (Patil et al., 2025, "The Berkeley Function Calling Leaderboard (BFCL): From Tool Use to Agentic Evaluation of Large Language Models").
detection:
  - icon: 🔗
    heading: Argument provenance checking
    body: >-
      Trace each argument value back to its source: a user statement, a prior tool result, or the tool spec's documented default. A customer_id that appears nowhere upstream is fabricated; a cluster name that matches an early turn but not the latest correction is stale. Both kinds of error are detectable from the transcript without knowing the right answer.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Have the judge compare each call's arguments against the current conversation state, flagging values the model guessed where the user never specified them, especially silently chosen defaults such as an org-admin scope where the request implied something far narrower.
  - icon: 🧪
    heading: Golden-set evals
    body: Build tasks where required values must be resolved by lookup rather than generated, and tasks that change a parameter mid-session, then score the arguments of each call rather than the well-formedness of the JSON. Schema-valid calls carrying wrong values are exactly the cases worth counting.
mitigation:
  - icon: 🔎
    heading: Tool-backed lookup
    body: Make identifiers something the model resolves and never generates. Provide search and resolve tools beside the operational ones, and instruct that any ID, path, or account reference must come from a lookup result or the user's own words. Arguments come from the same next-token process that hallucinates facts, so a fabricated ID such as cust_meridian_001 looks as plausible as the real one.
  - icon: 🗃️
    heading: Explicit state tracking
    body: Hold current parameter values (the deploy target, the active customer, the working directory) in a structured state block that updates when the user changes them, and have calls draw from it rather than from transcript recall. A stale value gets replayed because a mid-session correction, such as switching the deploy target from us-east-1 to the EU cluster, sits mid-context where retrieval is weakest; a maintained table of current values holds no stale copy. For large payloads, pass a handle or let code carry the value between calls rather than having the model re-emit it.
  - icon: 🗂️
    heading: Tool catalog curation
    body: >-
      Rule out wrong values in the tool definition: name parameters for what they take (user_id, not user), use enums for closed sets under strict schema enforcement, and add a few worked example calls showing the ID formats and optional-parameter combinations a schema cannot express. Strict mode guarantees the shape of a call; names, enums, and examples are what narrow its values.
  - icon: 🔁
    heading: Validate-and-retry loops
    body: >-
      Validate arguments semantically at the boundary before execution: check that the ID exists, the file is present, and the scope is plausible for the request. Treat missing required parameters as errors rather than slots for silent defaults. An org-admin grant for a request that named one contractor should fail the scope check instead of succeeding quietly.

related:
