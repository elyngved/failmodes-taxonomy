id: insufficient-agency
categoryId: agency
name: Insufficient Agency
def: |-
  Fails to take obvious, low-risk next steps that are required or strongly implied by the task.

  Unlike Missing Tool Invocation, the omitted action need not involve a tool. Unlike Clarification Overuse, the issue is silent passivity rather than asking an unnecessary clarifying question.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - did nothing
  - stopped short of the obvious step
  - too passive
  - didn't take the next step
examples:
  - kind: fail
    label: Diagnosis delivered, action withheld
    text: Stops at describing the fix, although the task plainly implies making it and the fix is trivial and reversible.
    quote: |-
      User: The build is broken — sort it out, the team is blocked.
      Assistant: I found the issue: line 42 of webpack.config.js references a plugin that was removed in the last commit. Deleting that line would fix the build. Let me know if you'd like me to do that!
  - kind: warn
    label: Literal request done, implied steps stranded
    text: Fixes the asked-for line but says nothing about the same broken reference in two sibling configs it just read.
    quote: |-
      User: The build is broken — sort it out, the team is blocked.
      Assistant: Fixed — removed the stale plugin reference from webpack.config.js. The build passes now.
      [… webpack.prod.js and webpack.test.js contain the identical reference; their builds fail an hour later …]
  - kind: fail
    label: Unattended run parked on a trivial step
    text: Spends the night waiting for permission it already had, although nobody is there to answer and the step is cheap and undoable.
    quote: |-
      User: Port the sync engine to the new storage layer. Run overnight; I'll review in the morning.
      [… 20 minutes in: the test runner needs a dev dependency that the project's own setup notes say to install …]
      Assistant: The test suite needs the fixtures package, which isn't installed in this environment. Should I install it? I'll wait for your confirmation before going further.
      [… no further activity for nine hours …]
  - kind: ok
    label: Implied scope carried through
    text: Treats the goal of unblocking the team as the task and completes the obvious low-risk steps without waiting to be re-prompted.
    quote: |-
      User: The build is broken — sort it out, the team is blocked.
      Assistant: Fixed. The removed plugin was still referenced in webpack.config.js — and in the prod and test configs, so I cleaned all three. All builds pass; the team is unblocked.
why:
  - Chat fine-tuning teaches an answer-and-stop rhythm. The dominant training pattern is one response per user turn, so carrying a task forward across obvious next steps without being re-prompted runs against the most practiced shape of a response, even in models also tuned for agentic work.
  - >-
    Safety and caution training overgeneralizes. Penalties for unauthorized or risky action push the model toward inaction in cases that are actually low-risk and clearly implied by the task. Knowing when to act is a separate skill from being able to do the task. On paired tasks that differ only in whether acting is warranted, the best of 17 frontier models got both sides right 59.5% of the time, and the ability was largely independent of task-solving strength (Liu et al., 2026, "AgentAbstain: Do LLM Agents Know When Not to Act?").
  - The model treats unstated steps as unrequested. Implied next actions live in pragmatic context rather than literal instructions, and instruction-tuned models weight the literal request far more heavily than the inferred goal.
  - Preference data punishes overstepping more visibly than understepping. A rater notices an unwanted action immediately, while a missing next step often reads as a complete answer, so the asymmetry tunes models toward passivity.
  - >-
    Without clear ownership, agents pick the safe work. In one report on running many coding agents in parallel with no hierarchy, agents avoided difficult tasks and made small, safe changes, and no agent took responsibility for the hard problems, so work churned without progress (Cursor, 2026, "Scaling long-running autonomous coding").
detection:
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Ask an LLM judge what obvious, low-risk steps the task implied and which of them the response completed. The signature is a response that describes a one-line fix and closes with "let me know if you'd like me to do that," delivering the diagnosis and withholding a trivially reversible action.
  - icon: 📈
    heading: User correction mining
    body: Mine follow-up turns for re-prompts that merely authorize the obvious, such as "yes, do it," "go ahead," or "I meant fix it." A high rate of single-step approval turns after responses that stopped short measures systematic passivity directly from production traffic. In unattended runs, the same signal shows up as idle time, when a session ends its last turn on a question and then sits until a human returns.
  - icon: 🧪
    heading: Golden-set evals
    body: Build tasks whose goal plainly implies follow-through, such as a broken build with the same stale reference in three configs, and score against the implied scope, not the literal request. A response that fixes only the named file earns partial credit, and that is exactly the miss worth measuring. Pair each with a variant where holding back is correct and score the pair, so a system cannot pass by always acting or always deferring.
mitigation:
  - icon: 🎚️
    heading: Risk-tiered autonomy policy
    body: Define action tiers by reversibility and grant standing autonomy on the lowest tier. Deleting one stale config line, for instance, is a trivially undoable edit, not a decision needing sign-off. Safety tuning overgeneralizes caution; an explicit low-risk tier gives the model permission to act where deference was never wanted. For unattended runs, say in the task brief that nobody will answer questions, so the lowest tier proceeds and anything above it is logged for the human and set aside while the rest of the work continues.
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Instruct the model to treat the stated goal, not the literal sentence, as the task: "sort it out" means the build works when you stop, including the sibling configs you just read. The answer-and-stop rhythm is the trained default, so carrying work forward has to be authorized explicitly.
  - icon: ✅
    heading: Self-check pass
    body: Before ending the turn, have the model list the obvious next steps the task implies and check each as done, deferred with a reason, or wrongly stranded. A response that fixes the named config and leaves two sibling configs with the same reference to fail an hour later passes any output-quality check; only an explicit implied-steps pass catches it.

related:
