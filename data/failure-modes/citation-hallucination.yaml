id: citation-hallucination
categoryId: fabrication
name: Citation Hallucination
def: |-
  Invents or fabricates a source artifact such as a citation, URL, paper, author listing, or bibliography entry and presents it as real.

  Unlike Citation Span Mismatch, the cited object itself is nonexistent or fabricated. Unlike Authority Hallucination, the failure is the fake reference artifact rather than a vague or false appeal to institutional authority.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - made up a citation
  - fake citation
  - invented a source
  - cited a paper that doesn't exist
  - fake reference
why:
  - >-
    Citations follow a rigid template (author, year, title, venue). The model can fill that template with real author names, a plausible title, and a real journal, producing a reference that looks perfect but does not exist. An audit of chatbot-written literature reviews found 55% of GPT-3.5's citations and 18% of GPT-4's were fabricated, and a further 43% and 24% of the real ones carried substantive errors (Walters & Wilder, 2023, "Fabrication and errors in the bibliographic citations generated by ChatGPT").
  - Verbatim memorization grows with how often a text is repeated in training data, and text seen only a few times is reproduced far less often (Carlini et al., 2023, "Quantifying Memorization Across Neural Language Models"). Most individual papers' bibliographic details are not repeated that often, so the model retains a fuzzy gist of the literature rather than exact bibliographic records, and it has no internal database to check whether a remembered reference is real.
  - Training and evaluation reward a confident answer over an admitted gap, because accuracy-only scoring gives a guess some chance of credit and an abstention none (Kalai et al., 2025, "Why Language Models Hallucinate"). Instruction tuning also teaches that good research answers include references, so a prompt that demands sources pressures the model to emit citation-shaped text whether or not it is grounded.
  - >-
    Fabricated URLs are cheap to produce. Link structure is easy to predict (a real domain plus a plausible path), and the model never observes whether the page exists. Search access does not close the gap: across ten models and deep-research agents, 3–13% of cited URLs had never existed and 5–18% did not resolve, and giving the models a URL-checking tool cut non-resolving links to under 1% (Rao et al., 2026, "Detecting and Correcting Reference Hallucinations in Commercial LLMs and Deep Research Agents").
  - >-
    Fabricated references reach the public record because they read as real. Court decisions noting fabricated case law and false quotations in filings number in the thousands (Charlotin, 2026, "AI Hallucination Cases Database"), and 100 fabricated citations passed peer review into 53 accepted papers at one major ML conference; two-thirds were total fabrications and most of the rest were real references with corrupted authors, titles or identifiers (Ansari, 2026, "Compound Deception in Elite Peer Review: A Failure Mode Taxonomy of 100 Fabricated Citations at NeurIPS 2025").
examples:
  - kind: fail
    label: Fabricated reference
    text: Fills the citation template with real-looking authors, a plausible title, and a real journal, but the paper does not exist.
    quote: |-
      User: Can you give me peer-reviewed sources on whether bilingualism delays dementia?
      Assistant: Yes. The key study is Chen, R., & Virtanen, S. (2019). "Bilingualism and the Onset of Dementia: A 20-Year Cohort Meta-Analysis." Journal of Cognitive Neuroscience, 31(4), 512–528.
      [… no such paper exists; the journal and author names are individually real …]
  - kind: fail
    label: Fabricated URL in a research report
    text: Composes one link from a real domain and a plausible path even with live search available. The link sits among dozens of working links, so nobody clicks it before the report ships.
    quote: |-
      User: Write me a sourced brief on whether bilingualism delays dementia.
      Tool: [web_search → 14 results; fetched 9 pages]
      Assistant: …a 2019 meta-analysis confirmed the effect (https://www.thelancet.com/journals/laneur/article/bilingualism-dementia-2019) …
      [… that URL appears in no search result and returns a 404 …]
  - kind: warn
    label: Disclaimed but citation-shaped
    text: Admits it cannot verify the references, yet still emits a fully formatted bibliography. The formatting invites trust that the disclaimer does not cancel.
    quote: |-
      User: Can you give me peer-reviewed sources on whether bilingualism delays dementia?
      Assistant: I can't verify these exactly, but relevant papers include: Bialystok et al. (2007), Neuropsychologia; Craik et al. (2010), Neurology; Chen & Virtanen (2019), J. Cogn. Neurosci.
  - kind: ok
    label: Declines to fabricate
    text: Answers from general knowledge and routes the user to a real lookup instead of composing references it cannot confirm.
    quote: |-
      User: Can you give me peer-reviewed sources on whether bilingualism delays dementia?
      Assistant: There is real research on this — Bialystok and Craik are the most-cited authors in the area — but I can't produce verified citations from memory. Searching "bilingualism dementia onset" on PubMed or Semantic Scholar will surface the actual papers.

detection:
  - icon: 🔎
    heading: Reference existence lookup
    body: Resolve every emitted citation against a bibliographic database such as CrossRef, Semantic Scholar, or PubMed. Fabricated references fail the lookup even when the authors, journal, and year are all individually real.
  - icon: 🔗
    heading: URL liveness checking
    body: Fetch every link in the output, and diff the cited URLs against the URLs the agent's search and fetch tools actually returned. A fabricated URL typically 404s or resolves to a page unrelated to the claim, and a URL that appears in no tool result was composed by the model.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain prompts that demand sources in niche areas where the model has only gist-level knowledge, and regression-test the share of returned citations that resolve in a bibliographic database.

mitigation:
  - icon: 📚
    heading: Retrieval grounding
    body: Only allow citations of documents actually present in retrieved context, referenced by identifier, so every bibliography entry traces to a real artifact the system handled rather than to parametric memory.
  - icon: 🛠️
    heading: Tool-backed lookup
    body: Route citation generation through a search or DOI-resolver tool so the model copies references from lookup results instead of composing them, and give research agents a link checker to run on their own draft before it ships. The model then has no way to emit a citation the lookup did not return.
  - icon: 📝
    heading: Instruction constraints
    body: Explicitly permit answering without a reference (for example, "no verified source available"), so the format pressure to produce citation-shaped text stops outweighing the lack of a real one.

related:
