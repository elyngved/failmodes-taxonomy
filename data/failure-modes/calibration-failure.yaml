id: calibration-failure
categoryId: response-integrity
name: Calibration Failure
def: |-
  Misstates confidence, uncertainty, evidence strength, risk, tradeoffs, or likelihood in the final answer.

  Unlike Unknown-Answer Fabrication, calibration failure can occur even when the answer is mostly correct. Unlike Unsafe Reassurance, it includes both overconfidence and excessive hedging, not only under-cautious reassurance.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - sounded way too confident
  - too sure of itself
  - overconfident answer
  - wrong confidence level
why:
  - >-
    Verbal confidence is generated as style, not read off an internal probability. Stated certainty correlates poorly with actual accuracy, so the answer's tone and its reliability are produced by largely separate processes (Xiong et al., 2024, "Can LLMs Express Their Uncertainty? An Empirical Evaluation of Confidence Elicitation in LLMs"). Readers then add their own error: given default explanations they overestimate accuracy, and longer explanations raise their confidence even when accuracy is unchanged (Steyvers et al., 2025, "What large language models know and what people think they know").
  - Alignment tuning damages the calibration pretraining built. Base model token probabilities track correctness reasonably well, and post-training measurably degrades that correspondence (OpenAI, 2023, "GPT-4 Technical Report").
  - Binary-graded training and evaluation reward guessing over abstention. When a confident wrong answer and an honest "I'm not sure" score the same zero, but a confident guess sometimes scores one, the optimal learned policy is to state guesses as facts (Kalai et al., 2025, "Why Language Models Hallucinate").
  - >-
    Preference data penalizes doubt, so overconfidence is the dominant direction. Deployed models rarely volunteer uncertainty even when wrong, users rely on answers whether or not they are hedged, and annotators in post-training preference data are biased against text that expresses uncertainty (Zhou et al., 2024, "Relying on the Unreliable: The Impact of Language Models' Reluctance to Express Uncertainty"); models also attach certainty markers to incorrect answers across languages (Rathi et al., 2025, "Humans overrely on overconfident language models, across languages"). The hedging that does survive tends to be generic disclaimers on safe topics, so expressed confidence fails in both directions and conveys little about which statements actually deserve trust.
  - >-
    Extended reasoning helps calibration without settling it. Reasoning models express better-calibrated confidence than their non-reasoning counterparts in most settings tested (Yoon et al., 2025, "Reasoning Models Better Express Their Confidence"), yet other evaluations find them typically overconfident, with self-reported confidence often above 85% on wrong answers and rising with deeper reasoning (Mei et al., 2025, "Reasoning about Uncertainty: Do Reasoning Models Know When They Don't Know?"). A longer chain of thought is not a confidence signal.
examples:
  - kind: fail
    label: Unearned certainty
    text: States a workload-dependent judgment as settled fact, with no mention of what it hinges on.
    quote: |-
      User: Which will be faster for my app's workload, Postgres or MongoDB?
      Assistant: Postgres, definitely — it will be significantly faster for your workload. There's really no debate here.
  - kind: warn
    label: Boilerplate hedging
    text: Buries a question with a known answer under generic disclaimers that convey no real uncertainty.
    quote: |-
      User: What's the default port for Postgres?
      Assistant: It's difficult to say with certainty, as configurations vary widely, but in many typical setups it may often be 5432. You should verify this for your specific environment.
  - kind: ok
    label: Confidence tracks evidence
    text: Separates what is known from what depends on unstated specifics, and says which is which.
    quote: |-
      User: Which will be faster for my app's workload, Postgres or MongoDB?
      Assistant: I can't say from this alone — it genuinely depends on your read/write mix, query shapes, and data model. If your workload is relational with complex joins, Postgres usually wins; for document-shaped data with simple lookups, MongoDB often does. What does your access pattern look like?
detection:
  - icon: 📊
    heading: Confidence-accuracy auditing
    body: >-
      Extract the verbal confidence of answers (definitely, probably, hard to say) and chart it against measured correctness over a labeled set. Calibration is a statistical property; the curve shows whether "definitely" answers are actually right more often than "probably" ones, which no single response can reveal. Where you can, chart user confidence too: readers take cues from length and phrasing, so a model can be calibrated on paper and still leave users overconfident.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: >-
      Have the judge check both directions: settled facts buried under boilerplate disclaimers, and workload-dependent judgments stated as certainties. The question to pose per claim is whether the expressed confidence matches the evidence the response itself presents.
  - icon: 🧪
    heading: Golden-set evals
    body: Build items with known epistemic status (facts with one answer, questions that genuinely hinge on unstated specifics) and score whether expressed confidence tracks the category. Answering "Postgres, definitely" to a question about which database is faster for a workload, and hedging on Postgres's default port, are the same failure measured from both ends.
mitigation:
  - icon: 🎯
    heading: Calibration tuning
    body: Train expressed confidence against measured accuracy, and grade with partial credit for honest abstention so a confident guess stops dominating "I'm not sure." RLHF damaged the calibration pretraining built, so tuning that scores the confidence-accuracy curve directly, rather than rater approval, repairs it at the stage where the damage happened.
  - icon: 🤐
    heading: Confidence-based abstention
    body: >-
      Elicit a confidence estimate separately from the answer and let it gate the phrasing: low scores get the "it depends on" framing, high scores are allowed "definitely," and the model can no longer pick confidence words freely. Verbal certainty is generated as style, and binding it to an elicited number reconnects the tone to the reliability.
  - icon: 📝
    heading: Instruction constraints
    body: >-
      Require the model to separate what is settled from what hinges on unstated specifics, and ban both failure directions by name: no "definitely" on judgments that depend on the user's situation, no boilerplate disclaimers on facts with one answer. An answer that states what is known, what is conditional, and which is which follows a format the prompt can specify.

