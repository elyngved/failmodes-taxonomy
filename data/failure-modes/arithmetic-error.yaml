id: arithmetic-error
categoryId: reasoning
name: Arithmetic Error
def: |-
  Computes or transforms numeric inputs incorrectly, including arithmetic, aggregation, unit conversion, comparison, or formula application.

  Unlike Numerical Hallucination, the relevant numbers are grounded or supplied but the calculation over them is wrong. Unlike Reasoning Error, this mode is specifically about numeric operations.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - got the math wrong
  - added it up wrong
  - miscalculated the total
  - wrong sum
examples:
  - kind: fail
    label: Incorrect total
    text: Adds inputs that are supplied and unambiguous, and gets the sum wrong.
    quote: |-
      User: What does the invoice come to? Line items are $52, $48, and $46.
      Assistant: The total is $142.
  - kind: fail
    label: Botched unit conversion
    text: Reproduces the shape of a conversion it has seen with the wrong factor, then builds on the bad number.
    quote: |-
      User: The tank holds 380 liters. How many gallons is that, and how many 5-gallon jugs do we need?
      Assistant: 380 liters is about 84 gallons, so you'll need 17 jugs.
  - kind: warn
    label: Unchecked inline math
    text: Computes the total inline with no steps or verification. The total happens to be right, but the same path produces wrong totals.
    quote: |-
      User: What does the invoice come to? Line items are $52, $48, and $46.
      Assistant: The total is $146.
  - kind: ok
    label: Tool-backed calculation
    text: Routes the arithmetic to deterministic execution and grounds the result in the computation.
    quote: |-
      User: What does the invoice come to? Line items are $52, $48, and $46.
      Tool: calculate(52 + 48 + 46) → 146
      Assistant: The total is $146.
why:
  - >-
    Tokenizers split numbers into fragments whose boundaries do not line up with place value, so digits get misaligned between operands (Nogueira et al., 2021, "Investigating the Limitations of Transformers with Simple Arithmetic Tasks"). The effect shrinks with scale and with written-out working (Singh and Strouse, 2024, "Tokenization counts: the impact of tokenization on arithmetic in frontier LLMs"), but it has not gone away: answering inline, frontier models still lose accuracy on integer addition as digit count grows, with most errors being operand misalignment or a dropped carry (Bie et al., 2026, "AI-rithmetic").
  - >-
    Models do arithmetic with a bag of heuristics, not one exact algorithm. Interpretability work finds sparse neurons keyed to operand patterns whose combined votes produce the answer (Nikankin et al., 2024, "Arithmetic Without Algorithms: Language Models Solve Math With a Bag of Heuristics"), and parallel paths, one estimating magnitude and one computing the last digit; asked how it added, the studied model described the schoolbook carry method it had not used (Lindsey et al., 2025, "On the Biology of a Large Language Model"). Heuristics cover familiar operands best, so accuracy rises with how often the terms appear in pretraining data (Razeghi et al., 2022, "Impact of Pretraining Term Frequencies on Few-Shot Reasoning").
  - >-
    Multi-digit operations require precise intermediate bookkeeping such as carries and partial products. Done in a single pass, this tracking is approximate and accuracy falls as the number of required intermediate steps grows (Dziri et al., 2023, "Faith and Fate: Limits of Transformers on Compositionality"). Writing the steps out helps but does not end the errors: across four models on math problems, two of them reasoning models, procedural slips were the most frequent error type, ahead of misunderstood operations (Zhang and Graf, 2025, "Mathematical Computation and Reasoning Errors by Large Language Models"); a slip anywhere in a long working still corrupts the result.
  - Many systems answer numeric questions inline instead of routing them to a calculator or code execution, so nothing deterministic checks the result before it reaches the user.
detection:
  - icon: 🧮
    heading: Deterministic recomputation
    body: Extract every numeric operation from the output (sums, conversions, formula applications) and recompute it with code or a calculator. Inputs and operations are visible in the response, so mismatches are mechanically detectable with no judgment call involved.
  - icon: 🪜
    heading: Step-level validation
    body: Check intermediate values, not just the final answer. A botched conversion factor or a dropped carry is visible at the step where it happens, and a final answer that is accidentally right can still hide broken arithmetic that will fail on the next input.
  - icon: 🧪
    heading: Golden-set evals
    body: Weight the eval toward rare operand combinations, long operands, and conversions with uncommon factors. Accuracy tracks training-data frequency and falls with digit count, so round numbers and familiar pairs will overstate reliability. Run it with reasoning on and off; a model that is reliable while thinking can still be wrong on the fast path production uses.
mitigation:
  - icon: 🧮
    heading: Tool-backed math
    body: Route every numeric operation (sums, conversions, formula applications) to a calculator or code execution instead of computing inline. Arithmetic is the rare failure with a complete mechanical fix; the model's job becomes setting up the right computation, which is what it's actually good at, and the digits come from something deterministic.
  - icon: 📝
    heading: Instruction constraints
    body: Forbid silent inline arithmetic. Require each operation written out with its operands and intermediate values, including conversion factors stated before they're applied. An inline total that happens to be right comes from the same path as the wrong ones; making the work explicit gives a recomputation check something to bind to and surfaces the wrong factor before it gets built on. Written working is something to check, not proof; the model's account of how it computed need not match how it did.
  - icon: 🔁
    heading: Validate-and-retry loops
    body: Extract the operations from the draft where tool routing isn't available, recompute them deterministically, and regenerate on mismatch with the wrong value named. Per-attempt accuracy is a function of training-data frequency, but the check catches a wrong value in any operation it extracts, at the cost of an occasional retry.

related:
