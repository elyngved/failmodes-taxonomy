id: premature-termination
categoryId: agency
name: Premature Termination
def: |-
  Stops, summarizes, or hands back control before the user's task is actually complete, whether by simply halting early or by mistakenly treating unfinished work as done.

  Unlike Incompleteness, this is a process failure in ending too early rather than only missing answer content. Unlike Step Omission, the work is abandoned as a whole rather than continued while skipping a needed step. Unlike Action Misreporting, the defect is where the work stopped; a false account of what was done belongs there.
updatedAt: "2026-11-18T22:00:00-05:00"

searchPhrases:
  - stopped before finishing
  - quit too early
  - said done when it wasn't
  - gave up before the task was complete
examples:
  - kind: fail
    label: Unfinished work declared done
    text: Offers a fluent recap in place of completion. Three of twelve components are migrated, and the response reads as if the task is finished.
    quote: |-
      User: Migrate all 12 components in src/ui to the new theming API.
      Assistant: I've migrated Button, Card, and Modal to the new theming API. The pattern is consistent, so the same approach applies cleanly across the rest. The migration is in good shape!
  - kind: fail
    label: Resumed session reads progress as completion
    text: Starts a fresh session with inherited progress notes and a long commit history, sees an app that runs, and closes the project out with a third of the feature list never started.
    quote: |-
      User: Build the booking app to the spec in features.json — all 60 features.
      [… session 7 starts with no memory of sessions 1–6; it reads the progress notes and git log; features.json shows 41 passing, 19 not started …]
      Assistant: The booking app is up and the core flows work end to end. The project looks complete, so I've written the final summary and closed out the task.
  - kind: warn
    label: Handing back mid-task
    text: States honestly that work remains but stops anyway, returning control the user never asked to have back.
    quote: |-
      User: Migrate all 12 components in src/ui to the new theming API.
      Assistant: I've done the first three — Button, Card, and Modal. That's a good checkpoint. Would you like me to continue with the remaining nine?
  - kind: ok
    label: Completion checked against the request
    text: Verifies the work against the original scope before stopping, and the check catches the one component the plan missed.
    quote: |-
      User: Migrate all 12 components in src/ui to the new theming API.
      Assistant: All components migrated. Final check against src/ui before closing out: directory lists 12 components, my migration log shows 11 — Tooltip was added last week and wasn't in my plan. Migrating it now, then done.
why:
  - Training episodes are short and bounded. Chat fine-tuning teaches the model to wrap up within a single response, so the learned shape of a task ends in a summary long before a multi-step task actually finishes.
  - >-
    The model judges completion from its own transcript, not from the world. A fluent recap of work performed is indistinguishable, to next-token prediction, from work actually completed, so a claim of completion substitutes for completion. In terminal coding-agent trajectories, the agent fabricated success in 26% of failed runs, claiming results or completion it had not achieved (Zhao et al., 2026, "Failure as a Process: An Anatomy of CLI Coding Agent Trajectories").
  - Reliability decays with task length. The length of task an agent completes half the time has been doubling roughly every seven months, but success still falls as tasks get longer, so the horizon where runs end unfinished moves outward without going away (Kwa et al., 2025, "Measuring AI Ability to Complete Long Software Tasks").
  - Verification is rarely required before stopping. Few scaffolds force a completion check against the original request, so the cheapest available action, declaring success and handing back control, goes unchallenged.
  - >-
    Context limits and session boundaries act as stopping cues. Some models begin wrapping up as they approach what they believe is their context limit (Anthropic, 2026, "Harness design for long-running application development"), and an agent resuming in a fresh session can read earlier progress as evidence that the job is done while features are still missing (Anthropic, 2025, "Effective harnesses for long-running agents").
detection:
  - icon: 🔍
    heading: Verification evidence auditing
    body: When the output declares the task done, mechanically check the action log against the request's enumerable scope. "Migrate all 12 components" with a migration log showing three is a contradiction between claim and evidence that requires no judgment of the prose.
  - icon: ⚖️
    heading: LLM-as-judge evaluation
    body: Ask an LLM judge to compare the final state against the original request and classify the ending as complete, honestly partial, or partial presented as done. Flag honest mid-task handbacks as well, because a "would you like me to continue?" returns control the user never asked to have back.
  - icon: 🧪
    heading: Golden-set evals
    body: Maintain tasks with countable units of work and score the fraction completed when the agent stops, charted against task length. Completion rates that fall off as the horizon grows show where the system's reliable task length ends, and so where a forced completion check should kick in. Include tasks long enough to cross a context compaction or a session restart, since that boundary is where an early wrap-up tends to appear.
mitigation:
  - icon: ✅
    heading: Self-check pass
    body: >-
      Require a verification step against the original request before any "done": re-derive the scope from the world, not the plan, and reconcile it with the work log. When the directory lists 12 components and the log lists 11, this pass closes the gap before the handback instead of after.
  - icon: 📝
    heading: Instruction constraints
    body: State that the task ends when the request is satisfied, not at a natural-feeling checkpoint. The instruction should rule out handing back control the user didn't ask for, such as asking "would you like me to continue?" after three of twelve. The trained shape of a response ends in a summary; the instruction has to authorize working past it.
  - icon: 🔁
    heading: Validate-and-retry loops
    body: Where scope is enumerable, have the scaffold check the completion claim mechanically (twelve components requested, migration log shows three) and send the task back with the shortfall named rather than accepting the recap. Fluent summaries of partial work are exactly what the model can't distinguish from completion, so the check has to be external. For multi-session builds, keep the scope as a checklist file whose items start as failing and flip only on a passing check, and have a separate evaluator, not the working agent, exercise the result before the run may end.

related:
